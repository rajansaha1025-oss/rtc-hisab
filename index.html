<style>
/* Layout: গাঢ় নীল হেডার ব্যান্ড (ভিসা অ্যাপের ব্র্যান্ডের সাথে মিল), তার নিচে একটা কলাম, নিচে আইকনসহ ৫ ট্যাব। সব জায়গায় বড় টাচ-সাইজ। */
:root{
  --bg:#eef2f7; --card:#ffffff; --ink:#0f1b33; --mut:#64708a; --line:#e2e8f1; --soft:#edf3fa;
  --acc:#0b6fc2; --onacc:#ffffff; --good:#0a8a5c; --bad:#d02847; --warn:#b36a00;
  --goodbg:#e2f6ed; --badbg:#fde8ec; --warnbg:#fcf0d9;
  --hero-a:#0b132b; --hero-b:#14407a; --hero-c:#0e86b8; --onhero:#ffffff;
  --shadow:0 1px 2px rgba(15,27,51,.05),0 6px 18px rgba(15,27,51,.06);
  --f-body:'Hind Siliguri','Noto Sans Bengali',system-ui,sans-serif; --f-num:'JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#080e1d; --card:#111a30; --ink:#e8edf7; --mut:#93a0b8; --line:#222f49; --soft:#182642;
  --acc:#4cb4ea; --onacc:#06121f; --good:#3ccf98; --bad:#ff7088; --warn:#f0b04a;
  --goodbg:#0f2f29; --badbg:#3a1a24; --warnbg:#392c12; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#080e1d; --card:#111a30; --ink:#e8edf7; --mut:#93a0b8; --line:#222f49; --soft:#182642;
  --acc:#4cb4ea; --onacc:#06121f; --good:#3ccf98; --bad:#ff7088; --warn:#f0b04a;
  --goodbg:#0f2f29; --badbg:#3a1a24; --warnbg:#392c12; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;padding-block:0 96px}
button,input,select,textarea{font:inherit;color:inherit}
svg.ic{width:1.25em;height:1.25em;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.wrap{max-width:760px;margin:0 auto}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(100deg,var(--hero-a),var(--hero-b));color:var(--onhero);padding-block:12px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hero-a);z-index:30}
main{padding-block:14px 0}
.hd{display:flex;align-items:center;gap:10px}
.logo{width:42px;height:42px;border-radius:13px;background:#fff;padding:3px;object-fit:contain;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.25)}
header.top h1{font-size:18px;margin:0;font-weight:700;flex:1;min-width:0;line-height:1.2}
header.top h1 small{display:block;font-size:11.5px;font-weight:500;opacity:.7}
.ib{border:1px solid var(--line);background:var(--card);border-radius:12px;width:40px;height:40px;cursor:pointer;display:grid;place-items:center;color:var(--ink);flex:none}
header .ib{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.18);color:#fff}
.sync{font-size:11px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--soft);color:var(--mut);white-space:nowrap}
header .sync{background:rgba(255,255,255,.14);color:#fff}
header .sync.ok{color:#8af3c6} header .sync.bad{color:#ff9fb0} header .sync.warn{color:#ffd48a}
.sync.ok{background:var(--goodbg);color:var(--good)} .sync.bad{background:var(--badbg);color:var(--bad)} .sync.warn{background:var(--warnbg);color:var(--warn)}
header .sync.ok,header .sync.bad,header .sync.warn{background:rgba(255,255,255,.14)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);min-width:0}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;min-width:0}
.between{justify-content:space-between}
.wrapr{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mut{color:var(--mut)} .sm{font-size:12.5px} .b{font-weight:700}
.good{color:var(--good)} .bad{color:var(--bad)} .warnc{color:var(--warn)}
h2{font-size:12.5px;font-weight:700;margin:8px 4px -4px;color:var(--mut);letter-spacing:.06em}
.hero{background:linear-gradient(135deg,var(--hero-a) 0%,var(--hero-b) 62%,var(--hero-c) 130%);color:var(--onhero);border:0;padding:20px 18px 16px;border-radius:22px;box-shadow:0 10px 28px rgba(11,40,90,.28)}
.hero .big{font-size:38px;font-weight:700;line-height:1.1;margin:6px 0 2px}
.hero .mut{color:inherit;opacity:.72}
.hero .tri{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.hero .tri div{background:rgba(255,255,255,.12);border-radius:13px;padding:9px 10px;min-width:0}
.hero .tri small{display:block;font-size:11px;opacity:.75}
.hero .tri b{font-size:14px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--mut)}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--mut);white-space:nowrap}
.pill.good{background:var(--goodbg);color:var(--good)} .pill.bad{background:var(--badbg);color:var(--bad)} .pill.warn{background:var(--warnbg);color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 15px;cursor:pointer;font-size:13.5px;font-weight:500}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--onacc);font-weight:600}
.chip.rm{padding-right:10px}
.btn{border:0;background:linear-gradient(135deg,var(--hero-c),var(--acc));color:#fff;border-radius:13px;padding:12px 18px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn.ghost{background:var(--soft);color:var(--acc)}
.btn.danger{background:var(--badbg);color:var(--bad)}
.btn.good{background:var(--goodbg);color:var(--good)}
.btn.warnb{background:var(--warnbg);color:var(--warn)}
.btn.sm{padding:8px 13px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
label{display:block;font-size:12.5px;font-weight:600;color:var(--mut);margin:0 0 5px}
input,select,textarea{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;min-width:0}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--acc)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
textarea{resize:vertical;min-height:66px}
.field{display:flex;flex-direction:column;min-width:0}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:15;box-shadow:0 10px 24px rgba(11,60,120,.38);border-radius:99px;padding:14px 22px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--card);border-top:1px solid var(--line);display:flex;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs button{flex:1;border:0;background:none;padding:7px 2px 5px;cursor:pointer;color:var(--mut);font-size:11.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:12px;max-width:150px;margin:0 auto}
nav.tabs button svg{width:23px;height:23px}
nav.tabs button.on{color:var(--acc);background:var(--soft)}
.item{display:flex;flex-direction:column;gap:10px;cursor:pointer}
.nm{font-weight:700;font-size:16.5px;word-break:break-word}
.avatar{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-weight:700;font-size:17px;flex:none;background:var(--soft);color:var(--acc)}
.avatar.g{background:var(--goodbg);color:var(--good)} .avatar.r{background:var(--badbg);color:var(--bad)} .avatar.w{background:var(--warnbg);color:var(--warn)}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.mini div{background:var(--bg);border-radius:11px;padding:7px 2px;min-width:0}
.mini small{display:block;font-size:10.5px;color:var(--mut)} .mini b{font-size:13.5px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.quick button{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:12px 4px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:7px;font-weight:600;font-size:12px;color:var(--ink);box-shadow:var(--shadow)}
.quick .qi{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--soft);color:var(--acc)}
.quick .qi svg{width:21px;height:21px}
.quick .qi.g{background:var(--goodbg);color:var(--good)} .quick .qi.r{background:var(--badbg);color:var(--bad)} .quick .qi.w{background:var(--warnbg);color:var(--warn)}
.alert{display:flex;gap:11px;align-items:center;padding:11px 12px;border-radius:14px;background:var(--bg);cursor:pointer}
.prog{height:7px;border-radius:9px;background:var(--soft);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--hero-c),var(--good));border-radius:9px}
#sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden]{display:none}
.sh-bg{position:absolute;inset:0;background:rgba(5,10,25,.6)}
.sh{position:relative;background:var(--card);width:100%;max-width:640px;max-height:92dvh;border-radius:24px 24px 0 0;display:flex;flex-direction:column;border:1px solid var(--line)}
.sh-h{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line);font-size:17px}
.sh-b{padding:16px 18px calc(20px + env(safe-area-inset-bottom,0px));overflow:auto;display:flex;flex-direction:column;gap:14px}
.x{border:0;background:none;font-size:18px;cursor:pointer;color:var(--mut);padding:4px 8px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:13.5px;font-weight:600;z-index:60;max-width:90vw;box-shadow:0 8px 20px rgba(0,0,0,.3)}
#toast[hidden]{display:none}
.bar{height:6px;border-radius:9px;background:var(--soft);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:9px}
.login{min-height:100dvh;display:grid;place-items:center;padding:20px 0}
.login .card{width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px;text-align:center}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.ipbox{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--bg)}
.seg{display:flex;background:var(--soft);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:11px;padding:9px 4px;font-weight:600;font-size:13.5px;cursor:pointer;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
@media (prefers-reduced-motion:no-preference){.sh{animation:up .18s ease-out}@keyframes up{from{transform:translateY(40px);opacity:.4}}}
[hidden]{display:none!important}
main{padding-bottom:64px}
.notetop{background:var(--warnbg);color:var(--warn);padding:8px 11px;border-radius:11px;font-size:13.5px;font-weight:600;word-break:break-word;white-space:pre-wrap}
.hs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.hs::-webkit-scrollbar{display:none}
.hs .chip{white-space:nowrap;flex:none}
nav.tabs button{font-size:11px;padding-left:0;padding-right:0}
details.wk>summary{list-style:none;cursor:pointer}details.wk>summary::-webkit-details-marker{display:none}
details.ipbox summary{font-size:13.5px}
</style>

  if (noJoma.length) h += '<div class="sm mut">⏸ ' + noJoma.length + 'টি ফাইলে joma date নেই, তাই এগুলোর IP এখন ধরা হয়নি: ' + noJoma.slice(0, 4).map(f => esc(f.name)).join(', ') + (noJoma.length > 4 ? '…' : '') + '</div>';

/* ---------- হিসাব ---------- */
// ডকুমেন্ট কাজ: চলমান/ডেলিভারড = বিল − খরচ; ফেরত = রাখা চার্জ − (খরচ হয়ে থাকলে খরচ)। লাভ "হয়েছে" ধরা হয় ডেলিভারড বা ফেরত হলে।
function docCalc(d) {
  const paid = sumAmt(d.payments), refunded = sumAmt(d.refunds), total = n(d.total), cost = n(d.cost), kept = n(d.kept); const st = d.status || 'run';
  const o = { paid, refunded, total, cost, kept, st };
  if (st === 'ret') { o.bill = kept; o.due = Math.max(0, kept - paid); o.refundDue = Math.max(0, paid - kept - refunded); o.profit = kept - (d.costDone ? cost : 0); o.real = true; o.over = 0; }
  else { o.bill = total; o.due = Math.max(0, total - paid); o.refundDue = 0; o.profit = total - cost; o.real = st === 'done'; o.over = Math.max(0, paid - total); }
  return o;
}
const docProfitDate = d => d.status === 'done' ? (d.doneDate || d.recvDate) : (d.status === 'ret' ? (d.retDate || d.recvDate) : '');
function cntCalc(c) { const paid = sumAmt(c.payments), total = n(c.total), cost = n(c.cost); return { paid, total, cost, due: Math.max(0, total - paid), profit: total - cost, over: Math.max(0, paid - total) }; }

}

function commit(coll, rec, base, msgs) {

async function mergeSave(coll, id, base) {
  if (MODE === 'cloud' && base) {
    try {
      const c = await cloud('GET', FB.root + '/' + coll + '/' + id);

        [['payments', 'pay'], ['refunds', 'ref']].forEach(([k, bk]) => {
          const have = new Set(arr(mine[k]).map(p => p.id)), was = new Set(base[bk] || []);

/* ====================================================================

const DF = {
  all: ['সব', () => true], run: ['চলমান', x => x.d.status === 'run'], late: ['দেরি', (x, t) => x.d.status === 'run' && !!x.d.promiseDate && x.d.promiseDate < t],

    if (q && !((d.name || '') + ' ' + (d.phone || '') + ' ' + (d.refNo || '') + ' ' + (d.note || '') + ' ' + (d.cat || '')).toLowerCase().includes(q)) return false;

  $('ce_payments_l').innerHTML = mlHtml('ce', 'payments');
}
function ceSave() {
  ceGrab(); const s = CE; const by = PK.ce || ''; const c = cntCalc(s);
  if (!s.svc) { toast('সার্ভিস বাছুন'); return; } if (c.total <= 0) { toast('মোট টাকা দিন'); return; } if (pkNeed('ce')) { toast('কে করেছে — স্টাফ বাছুন'); return; }
  if (c.due > 0 && !s.name.trim() && !s.phone.trim()) { toast('বাকি থাকলে ক্লায়েন্টের নাম বা ফোন দিন'); return; }
  if (c.over > 0 && !s._ack) { s._ack = true; $('ce_warn').innerHTML = '⚠ জমা বিলের চেয়ে ' + money(c.over) + ' বেশি। ঠিক থাকলে আবার "সেভ" চাপুন'; $('ce_save').textContent = 'তবুও সেভ করুন'; return; }
  const old = s._orig;
  const rec = { id: s.id, date: s.date, svc: s.svc, qty: Math.max(1, n(s.qty)), total: c.total, cost: c.cost, name: s.name.trim(), phone: s.phone.trim(), note: s.note.trim(), by, payments: s.payments, createdAt: s.createdAt, createdBy: s.createdBy, log: s.log };
  commit('cnt', rec, s._base, logMsgs(old, rec, CKEYS)); CE = null; closeSheet(); toast('সেভ হয়েছে');
}
function ceDel() { remove('cnt', CE.id); CE = null; closeSheet(); toast('মুছে গেছে'); }

/* ====================================================================
   আরও মেনু · স্টাফ লক · সেটিংসের নতুন কার্ড · CSV
   ==================================================================== */
function vMore() {
  const b = (ico, cls, t, js) => '<button onclick="' + js + '"><span class="qi ' + cls + '">' + ic(ico) + '</span>' + t + '</button>';
  return '<div class="quick" style="grid-template-columns:repeat(3,1fr)">' + b('swap', 'w', 'বাকি খাতা', "go('loan')") + b('plane', '', 'ভিসা ফাইল', "go('visa')") + b('gear', 'g', 'সেটিংস', "go('set')") + '</div>'
    + '<h2>রিপোর্ট ও ব্যাকআপ (এক্সেলে খোলা যায়)</h2><div class="card stack"><button class="btn ghost" onclick="exportDocs()">⬇ ডকুমেন্ট কাজের তালিকা (CSV)</button><button class="btn ghost" onclick="exportCnt()">⬇ কাউন্টার সার্ভিসের তালিকা (CSV)</button><button class="btn ghost" onclick="backup()">⬇ পুরো ডাটার ব্যাকআপ (JSON)</button></div>'
    + '<p class="mut sm" style="text-align:center;margin:0">স্টাফের ফোনে শুধু ডকুমেন্ট ও কাউন্টার দেখাতে: সেটিংস → "স্টাফ লক"।</p>';
}
function csvDown(name, rows) {
  const cell = v => { v = String(v == null ? '' : v); if (/^[=+\-@]/.test(v) && isNaN(Number(v))) v = "'" + v; return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const b = new Blob(['﻿' + rows.map(r => r.map(cell).join(',')).join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name + '-' + today() + '.csv'; a.click();
}
function exportDocs() {
  const rows = [['কাজ নেওয়ার তারিখ', 'ধরন', 'নাম', 'ফোন', 'নম্বর', 'অবস্থা', 'ডেলিভারির তারিখ', 'ফেরতের তারিখ', 'মোট বিল', 'রাখা চার্জ (ফেরতে)', 'জমা', 'বাকি', 'ফেরত দেওয়া', 'ফেরত দিতে বাকি', 'খরচ', 'খরচ হয়েছে?', 'লাভ', 'লাভ ধরা হয়েছে?', 'স্টাফ', 'নোট']];
  Object.values(S.docs).sort((a, b) => (a.recvDate || '').localeCompare(b.recvDate || '')).forEach(d => { const c = docCalc(d); rows.push([d.recvDate, d.cat, d.name, d.phone, d.refNo, DSTAT[d.status || 'run'][0], d.doneDate, d.retDate, n(d.total), c.kept, c.paid, c.due, c.refunded, c.refundDue, c.cost, d.costDone ? 'হ্যাঁ' : 'না', c.profit, c.real ? 'হ্যাঁ' : 'না', d.by, d.note]); });
  csvDown('rtc-document-kaj', rows);
}
function exportCnt() {
  const rows = [['তারিখ', 'সময়', 'সার্ভিস', 'পরিমাণ', 'মোট বিল', 'পেয়েছি', 'বাকি', 'খরচ', 'লাভ', 'স্টাফ', 'ক্লায়েন্ট', 'ফোন', 'নোট']];
  Object.values(S.cnt).sort((a, b) => (a.date || '').localeCompare(b.date || '') || (a.createdAt || 0) - (b.createdAt || 0)).forEach(c => { const k = cntCalc(c); rows.push([c.date, tmS(c.createdAt), c.svc, n(c.qty), k.total, k.paid, k.due, k.cost, k.profit, c.by, c.name, c.phone, c.note]); });
  csvDown('rtc-counter', rows);
}
async function sha(s) { try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('rtc|' + s)); return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join(''); } catch (e) { return 'p|' + s; } }
async function setPin() { const v = val('s_pin').trim(); if (!/^\d{4,8}$/.test(v)) { toast('৪ থেকে ৮ সংখ্যার পিন দিন'); return; } S.settings.pin = await sha(v); saveSettings(); toast('পিন সেভ হয়েছে'); render(); }
function lockStaff() { if (!S.settings.pin) { toast('আগে পিন সেট করুন'); return; } ROLE = 'staff'; try { localStorage.setItem(K2.role, 'staff'); } catch (e) { } tab = 'doc'; render(); window.scrollTo(0, 0); toast('স্টাফ মোড চালু'); }
function unlockSheet() {
  sheet('মালিকের পিন', '<div class="field"><label for="u_pin">পিন দিন</label><input id="u_pin" type="password" inputmode="numeric" autocomplete="off" onkeydown="if(event.key===\'Enter\')doUnlock()"></div><button class="btn block" onclick="doUnlock()">খুলুন</button>'
    + (MODE === 'cloud' ? '<div class="sm mut">পিন ভুলে গেলে লগইন পাসওয়ার্ড দিয়ে খুলুন:</div><input id="u_pw" type="password" placeholder="লগইন পাসওয়ার্ড" autocomplete="current-password"><button class="btn ghost block" onclick="doUnlockPw()">পাসওয়ার্ড দিয়ে খুলুন</button>' : ''));
}
async function doUnlock() { if (S.settings.pin && (await sha(val('u_pin').trim())) !== S.settings.pin) { toast('পিন ভুল'); return; } unlockOk(); }
async function doUnlockPw() { try { await signIn(AUTH.email, val('u_pw')); unlockOk(); } catch (e) { toast('পাসওয়ার্ড ভুল'); } }
function unlockOk() { ROLE = ''; try { localStorage.removeItem(K2.role); } catch (e) { } tab = 'home'; closeSheet(); toast('মালিক মোড'); }
function svcCard() {
  const l = S.settings.services;
  return '<div class="card stack" style="gap:8px"><b>কাউন্টার সার্ভিস ও রেট</b><span class="mut sm">রেট দিলে (যেমন ফটোকপি ৳২) পরিমাণ দিলেই মোট টাকা নিজে বসে যাবে। রেট ০ রাখলে টাকা নিজে লিখতে হবে। নাম চেপে রেট বদলানো যায়।</span><div class="chips">'
    + l.map((x, i) => '<span class="chip rm"><span onclick="svcPick(' + i + ')" style="cursor:pointer">' + esc(x.n) + (n(x.r) ? ' · ৳' + n(x.r) : '') + '</span> <button class="x" style="font-size:14px" onclick="svcRm(' + i + ')" aria-label="মুছুন">✕</button></span>').join('')
    + '</div><div class="row"><input id="sv_n" placeholder="সার্ভিসের নাম"><input id="sv_r" type="number" inputmode="decimal" placeholder="রেট ৳" style="max-width:110px"><button class="btn sm" onclick="svcAddS()">সেভ</button></div></div>';
}
function svcPick(i) { const x = S.settings.services[i]; $('sv_n').value = x.n; $('sv_r').value = n(x.r) || ''; $('sv_r').focus(); }
function svcRm(i) { S.settings.services.splice(i, 1); saveSettings(); render(); }
function svcAddS() { const nm = val('sv_n').trim(); if (!nm) return; const r = n(val('sv_r')); const ex = S.settings.services.find(x => x.n === nm); if (ex) ex.r = r; else S.settings.services.push({ n: nm, r }); saveSettings(); render(); }
function lockCard() {
  return '<div class="card stack"><b>🔒 স্টাফ লক</b><span class="mut sm">স্টাফের ফোনে "স্টাফ মোড" চালু করলে শুধু ডকুমেন্ট ও কাউন্টার ট্যাব দেখাবে। হোমের লাভ-লোকসান, পাসপোর্ট, খরচ, বাকি খাতা, সেটিংস আর ডিলিট বন্ধ থাকবে। মালিক পিন দিয়ে আবার খুলবেন।</span>'
    + '<div class="row"><input id="s_pin" type="password" inputmode="numeric" placeholder="' + (S.settings.pin ? 'নতুন পিন (৪-৮ সংখ্যা)' : 'পিন বানান (৪-৮ সংখ্যা)') + '" autocomplete="off"><button class="btn sm" onclick="setPin()">পিন সেভ</button></div>'
    + '<button class="btn warnb" onclick="lockStaff()">' + ic('lock') + ' এই ফোনে স্টাফ মোড চালু করুন</button><span class="mut sm">এটা স্ক্রিন লক — সবাই একই ইমেইলে লগইন করে বলে ডাটাবেসের আসল সিকিউরিটি নয়।</span></div>';
}
