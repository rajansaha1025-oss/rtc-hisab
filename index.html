<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RTC হিসাব</title>
<meta name="theme-color" content="#0b132b">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: ছোট স্ক্রিন-প্রথম অ্যাপ। উপরে হেডার, মাঝে একটা কলাম, নিচে ৫ ট্যাবের বার। শিট নিচ থেকে ওঠে। */
:root{
  --bg:#f2f5f9; --card:#ffffff; --ink:#0b132b; --mut:#5b6577; --line:#e0e6ee; --soft:#eaf2f8;
  --acc:#0077b6; --onacc:#ffffff; --good:#0d8f60; --bad:#d12a47; --warn:#b86e00;
  --goodbg:#e3f6ee; --badbg:#fde9ed; --warnbg:#fdf1dc; --shadow:0 1px 2px rgba(11,19,43,.06),0 4px 14px rgba(11,19,43,.05);
  --f-body:'Hind Siliguri','Noto Sans Bengali',system-ui,sans-serif; --f-num:'JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a1020; --card:#121a30; --ink:#e8edf7; --mut:#93a0b8; --line:#243049; --soft:#17243f;
  --acc:#4cbaea; --onacc:#06121f; --good:#3ccf98; --bad:#ff7088; --warn:#f0b04a;
  --goodbg:#10302a; --badbg:#3a1a24; --warnbg:#392c12; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1020; --card:#121a30; --ink:#e8edf7; --mut:#93a0b8; --line:#243049; --soft:#17243f;
  --acc:#4cbaea; --onacc:#06121f; --good:#3ccf98; --bad:#ff7088; --warn:#f0b04a;
  --goodbg:#10302a; --badbg:#3a1a24; --warnbg:#392c12; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:0 92px}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.wrap{max-width:760px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 0 10px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
header.top h1{font-size:19px;margin:0;font-weight:700;flex:1;min-width:0}
header.top h1 small{display:block;font-size:11px;font-weight:500;color:var(--mut)}
.ib{border:1px solid var(--line);background:var(--card);border-radius:10px;width:38px;height:38px;cursor:pointer;font-size:16px;display:grid;place-items:center}
.sync{font-size:11px;font-weight:600;padding:4px 9px;border-radius:99px;background:var(--soft);color:var(--mut);white-space:nowrap}
.sync.ok{background:var(--goodbg);color:var(--good)} .sync.bad{background:var(--badbg);color:var(--bad)} .sync.warn{background:var(--warnbg);color:var(--warn)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;min-width:0}
.between{justify-content:space-between}
.wrapr{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mut{color:var(--mut)} .sm{font-size:12px} .b{font-weight:700}
.good{color:var(--good)} .bad{color:var(--bad)} .warnc{color:var(--warn)}
h2{font-size:13px;font-weight:700;margin:6px 2px 0;color:var(--mut);letter-spacing:.04em}
.hero{background:var(--ink);color:var(--bg);border:0;padding:18px}
.hero .big{font-size:34px;font-weight:700;line-height:1.1;margin:4px 0}
.hero .mut{color:inherit;opacity:.7}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--mut)}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--soft);color:var(--mut);white-space:nowrap}
.pill.good{background:var(--goodbg);color:var(--good)} .pill.bad{background:var(--badbg);color:var(--bad)} .pill.warn{background:var(--warnbg);color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 13px;cursor:pointer;font-size:13px;font-weight:500}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--onacc);font-weight:600}
.chip.rm{padding-right:9px}
.btn{border:0;background:var(--acc);color:var(--onacc);border-radius:11px;padding:10px 16px;font-weight:700;cursor:pointer}
.btn.ghost{background:var(--soft);color:var(--acc)}
.btn.danger{background:var(--badbg);color:var(--bad)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:9px}
.btn.block{width:100%}
label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:0 0 4px}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px;min-width:0}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
textarea{resize:vertical;min-height:62px}
.field{display:flex;flex-direction:column;min-width:0}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:15;box-shadow:0 6px 18px rgba(0,0,0,.25);border-radius:99px;padding:13px 20px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--card);border-top:1px solid var(--line);display:flex;
  padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
nav.tabs button{flex:1;border:0;background:none;padding:6px 2px;cursor:pointer;color:var(--mut);font-size:11.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:10px}
nav.tabs button i{font-style:normal;font-size:19px}
nav.tabs button.on{color:var(--acc);background:var(--soft)}
.item{display:flex;flex-direction:column;gap:8px;cursor:pointer}
.item .nm{font-weight:700;font-size:16px;word-break:break-word}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.mini div{background:var(--bg);border-radius:9px;padding:6px 2px;min-width:0}
.mini small{display:block;font-size:10.5px;color:var(--mut)} .mini b{font-size:13px}
#sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden]{display:none}
.sh-bg{position:absolute;inset:0;background:rgba(5,10,25,.55)}
.sh{position:relative;background:var(--card);width:100%;max-width:640px;max-height:92dvh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;border:1px solid var(--line)}
.sh-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);font-size:16px}
.sh-b{padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));overflow:auto;display:flex;flex-direction:column;gap:12px}
.x{border:0;background:none;font-size:18px;cursor:pointer;color:var(--mut)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13px;font-weight:600;z-index:60;max-width:90vw}
#toast[hidden]{display:none}
.bar{height:6px;border-radius:9px;background:var(--soft);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--acc)}
.login{min-height:100dvh;display:grid;place-items:center;padding:20px 0}
.login .card{width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px;text-align:center}
.empty{text-align:center;color:var(--mut);padding:26px 10px}
.ipbox{border:1px solid var(--line);border-radius:11px;padding:10px;background:var(--bg)}
.seg{display:flex;background:var(--soft);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:7px 4px;font-weight:600;font-size:13px;cursor:pointer;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
@media (prefers-reduced-motion:no-preference){.sh{animation:up .18s ease-out}@keyframes up{from{transform:translateY(40px);opacity:.4}}}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<div id="sheet" hidden></div>
<div id="toast" hidden></div>

<script>
/* ============================================================
   RTC হিসাব — দোকানের হিসাব + পাসপোর্ট ফাইল + IP সাপ্তাহিক হিসাব
   ডাটা: Firebase Realtime DB (/rtc_hisab) — ভিসা অ্যাপের একই প্রজেক্ট ও লগইন
   ============================================================ */
const FB = { key: 'AIzaSyCHSXIS5eCX-pQ9N-L2u5W1jSS7VoTRP1w', db: 'https://rtcvisa-fdbb5-default-rtdb.firebaseio.com', root: '/rtc_hisab', visa: '/rtc_visa_files' };
const K = { data: 'rtc_hisab_v1', q: 'rtc_hisab_q', auth: 'rtc_hisab_auth', mode: 'rtc_hisab_mode', visa: 'rtc_hisab_visa' };
const DAYS = ['রবিবার','সোমবার','মঙ্গলবার','বুধবার','বৃহস্পতিবার','শুক্রবার','শনিবার'];
const KIND = { shop: 'দোকান খরচ', personal: 'ব্যক্তিগত খরচ', income: 'অন্য আয়' };

const DEF = () => ({
  settings: { payDay: 4, payTime: '18:00', defaultIp: 1200, gmails: [], refs: ['মামা', 'Rajan', 'Omey'],
    cats: { shop: ['দোকান ভাড়া', 'বিদ্যুৎ বিল', 'স্টাফ বেতন', 'অন্যান্য'], personal: ['বাসা খরচ', 'টুকটাক', 'অন্যান্য'], income: ['অন্য সার্ভিসের লাভ', 'অন্যান্য'] } },
  expenses: {}, loans: {}, files: {}
});
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } };

let S = norm(lsGet(K.data, null));
let Q = lsGet(K.q, []);
let AUTH = lsGet(K.auth, null);        // {email, refresh}
let MODE = (function () { try { return localStorage.getItem(K.mode) || ''; } catch (e) { return ''; } })();   // 'cloud' | 'local' | ''
let idTok = '', idExp = 0, syncSt = 'idle', VISA = lsGet(K.visa, { at: 0, rows: [], err: '' });
let tab = 'home', fm = null;
const UI = { period: 'month', from: '', to: '', pf: 'all', pq: '', ek: 'shop', ym: '', loanQ: '' };

function norm(d) {
  const base = DEF(); if (!d || typeof d !== 'object') return base;
  const s = Object.assign({}, base.settings, d.settings || {});
  s.cats = Object.assign({}, base.settings.cats, (d.settings && d.settings.cats) || {});
  ['gmails', 'refs'].forEach(k => { s[k] = arr(s[k]); });
  ['shop', 'personal', 'income'].forEach(k => { s.cats[k] = arr(s.cats[k]); });
  const out = { settings: s, expenses: d.expenses || {}, loans: d.loans || {}, files: d.files || {} };
  Object.values(out.files).forEach(f => { f.payments = arr(f.payments); });
  Object.values(out.loans).forEach(l => { l.entries = arr(l.entries); });
  return out;
}
function arr(x) { return !x ? [] : (Array.isArray(x) ? x.filter(v => v != null) : Object.values(x)); }

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const n = v => parseFloat(v) || 0;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const money = v => { v = Math.round(n(v)); return (v < 0 ? '−' : '') + '৳' + Math.abs(v).toLocaleString('en-US'); };
const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const today = () => ymd(new Date());
const pd = s => new Date(s + 'T00:00:00');
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const fd = s => { if (!s) return ''; const d = pd(s); return d.getDate() + ' ' + MON[d.getMonth()] + (d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : ''); };
function toast(t) { const e = $('toast'); e.textContent = t; e.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => e.hidden = true, 2200); }
function persist() { lsSet(K.data, S); }

/* ---------- ক্লাউড (Firebase REST) ---------- */
async function signIn(email, pass) {
  const r = await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=' + FB.key, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password: pass, returnSecureToken: true }) });
  const j = await r.json(); if (!r.ok) throw new Error((j.error && j.error.message) || 'LOGIN_FAILED');
  AUTH = { email: j.email, refresh: j.refreshToken }; lsSet(K.auth, AUTH); idTok = j.idToken; idExp = Date.now() + (+j.expiresIn) * 1000;
}
async function token() {
  if (idTok && Date.now() < idExp - 60000) return idTok;
  if (!AUTH) throw new Error('AUTH');
  const r = await fetch('https://securetoken.googleapis.com/v1/token?key=' + FB.key, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: 'grant_type=refresh_token&refresh_token=' + encodeURIComponent(AUTH.refresh) });
  const j = await r.json(); if (!r.ok) { throw new Error('AUTH'); }
  idTok = j.id_token; idExp = Date.now() + (+j.expires_in) * 1000; AUTH.refresh = j.refresh_token; lsSet(K.auth, AUTH); return idTok;
}
async function cloud(method, path, body) {
  const t = await token();
  const r = await fetch(FB.db + path + '.json?auth=' + encodeURIComponent(t), { method, headers: { 'Content-Type': 'application/json' }, body: body === undefined ? undefined : JSON.stringify(body) });
  if (r.status === 401 || r.status === 403) { const e = new Error('PERM'); e.perm = true; throw e; }
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
function enqueue(m, p, b) {
  if (MODE !== 'cloud') return;
  Q = Q.filter(o => o.p !== p); Q.push({ m, p, b }); lsSet(K.q, Q); flush();
}
let flushing = false;
async function flush() {
  if (MODE !== 'cloud' || flushing) return; flushing = true; setSync(Q.length ? 'pending' : 'ok');
  try {
    while (Q.length) { const o = Q[0]; await cloud(o.m, o.p, o.m === 'DELETE' ? undefined : o.b); Q.shift(); lsSet(K.q, Q); }
    setSync('ok');
  } catch (e) { setSync(e.perm ? 'perm' : 'err'); if (!e.perm) setTimeout(flush, 15000); }
  flushing = false;
}
function setSync(s) { syncSt = s; const e = $('syncPill'); if (e) { const m = { ok: ['✓ ক্লাউডে সেভ', 'ok'], pending: ['⏳ সেভ হচ্ছে…', 'warn'], err: ['⚠ নেট নেই, পরে হবে', 'warn'], perm: ['⛔ ডাটাবেস পারমিশন নেই', 'bad'], idle: ['', ''], local: ['শুধু এই ফোনে', ''] }[s] || ['', '']; e.textContent = m[0]; e.className = 'sync ' + m[1]; } }
async function pull(quiet) {
  if (MODE !== 'cloud') return;
  try {
    await flush(); if (Q.length) return;
    const d = await cloud('GET', FB.root);
    if (d == null) { pushAll(); }
    else { S = norm(d); persist(); }
    setSync('ok'); if (!document.querySelector('#sheet:not([hidden])')) render();
  } catch (e) { setSync(e.perm ? 'perm' : 'err'); if (!quiet && e.perm) toast('Firebase rules এ /rtc_hisab এর পারমিশন দিন'); if (e.message === 'AUTH') { logout(true); } }
}
function pushAll() {
  enqueue('PUT', FB.root + '/settings', S.settings);
  ['expenses', 'loans', 'files'].forEach(c => Object.keys(S[c]).forEach(id => enqueue('PUT', FB.root + '/' + c + '/' + id, S[c][id])));
}
function save(coll, id) { persist(); enqueue('PUT', FB.root + '/' + coll + '/' + id, S[coll][id]); }
function remove(coll, id) { delete S[coll][id]; persist(); enqueue('DELETE', FB.root + '/' + coll + '/' + id); }
function saveSettings() { persist(); enqueue('PUT', FB.root + '/settings', S.settings); }

async function loadVisa(force) {
  if (MODE !== 'cloud') { VISA = { at: 0, rows: [], err: 'LOCAL' }; return; }
  if (!force && VISA.at && Date.now() - VISA.at < 120000) return;
  try {
    const raw = await cloud('GET', FB.visa);
    const list = (!raw || typeof raw !== 'object') ? [] : (Array.isArray(raw) ? raw : Object.values(raw)).filter(x => x && typeof x === 'object' && x.id);
    VISA = { at: Date.now(), rows: list.map(visaRow), err: '' }; lsSet(K.visa, VISA);
  } catch (e) { VISA.err = e.perm ? 'PERM' : 'NET'; }
}
// ভিসা অ্যাপের "হিসাব" ট্যাবের একই নিয়ম
function visaRow(f) {
  const ret = !!f.isReturned, del = !ret && !!f.isDelivered, appt = !!(f.isAppointed || f.appointmentDate);
  const paid = n(f.billAdvance); let bill, due, profit, kept = 0;
  if (ret) { kept = n(f.keptCharge); bill = kept; due = 0; profit = kept; }
  else { bill = n(f.billTotal); due = Math.max(0, bill - paid); const w = n(f.baseVisaFee) + n(f.softwareCharge); profit = (del || appt) ? bill - w : 0; }
  const ts = /^SET_(\d+)$/.test(f.id) ? +f.id.slice(4) : 0;
  return { id: f.id, serial: f.serial || '', name: (f.applicants && f.applicants[0] && f.applicants[0].name) || 'Unnamed', more: Math.max(0, (f.applicants || []).length - 1), mode: ret ? 'RETURNED' : (del ? 'DELIVERED' : (appt ? 'APPOINTED' : 'RUNNING')), bill, paid, due, profit, date: ts ? ymd(new Date(ts)) : '' };
}

/* ---------- হিসাবের নিয়ম ---------- */
function fileCalc(f) {
  const paid = (f.payments || []).reduce((s, p) => s + n(p.amt), 0);
  const ip = f.ipOn ? n(f.ipAmt) : 0;
  const cost = n(f.passFee) + ip;
  return { paid, ip, cost, due: Math.max(0, n(f.total) - paid), profit: n(f.total) - cost };
}
// joma date থেকে পরের (বা সেদিনই) পেমেন্ট-ডে
function payDayFor(s) { const d = pd(s); let g = 0; while (d.getDay() !== +S.settings.payDay && g++ < 8) d.setDate(d.getDate() + 1); return ymd(d); }
function ipGroups() {
  const g = {}; let noJoma = [];
  Object.values(S.files).forEach(f => {
    if (!f.ipOn || f.ipPaidDate) return;
    if (!f.jomaDate) { noJoma.push(f); return; }
    const pdte = payDayFor(f.jomaDate); (g[pdte] = g[pdte] || []).push(f);
  });
  return { groups: Object.keys(g).sort().map(d => ({ date: d, files: g[d], total: g[d].reduce((s, f) => s + n(f.ipAmt), 0) })), noJoma };
}
function range() {
  const now = new Date(), y = now.getFullYear(), m = now.getMonth(); const p = UI.period;
  if (p === 'month') return [ymd(new Date(y, m, 1)), ymd(new Date(y, m + 1, 0))];
  if (p === 'last') return [ymd(new Date(y, m - 1, 1)), ymd(new Date(y, m, 0))];
  if (p === 'year') return [y + '-01-01', y + '-12-31'];
  if (p === 'custom') return [UI.from || '', UI.to || ''];
  return ['', ''];
}
const inR = (d, r) => d && (!r[0] || d >= r[0]) && (!r[1] || d <= r[1]);

function overall() {
  const r = range(); const o = { pp: { n: 0, bill: 0, paid: 0, due: 0, fee: 0, ip: 0, profit: 0 }, exp: { shop: 0, personal: 0, income: 0 }, byCat: {}, visa: 0, visaN: 0 };
  Object.values(S.files).forEach(f => { if (!inR(f.appDate, r)) return; const c = fileCalc(f); const p = o.pp; p.n++; p.bill += n(f.total); p.paid += c.paid; p.due += c.due; p.fee += n(f.passFee); p.ip += c.ip; p.profit += c.profit; });
  Object.values(S.expenses).forEach(e => { if (!inR(e.date, r)) return; o.exp[e.kind] += n(e.amt); if (e.kind === 'shop') o.byCat[e.cat] = (o.byCat[e.cat] || 0) + n(e.amt); });
  VISA.rows.forEach(v => { if (!v.profit && !v.bill) return; if (UI.period === 'all' || (v.date && inR(v.date, r))) { o.visa += v.profit; o.visaN++; } });
  o.income = o.pp.profit + o.visa + o.exp.income; o.net = o.income - o.exp.shop; o.left = o.net - o.exp.personal;
  let get = 0, give = 0; Object.values(S.loans).forEach(l => { const b = loanBal(l); if (b > 0) get += b; else give -= b; });
  o.get = get; o.give = give; return o;
}
