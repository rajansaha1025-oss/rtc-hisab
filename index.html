<style>
/* Layout: গাঢ় নীল হেডার ব্যান্ড (ভিসা অ্যাপের ব্র্যান্ডের সাথে মিল), তার নিচে একটা কলাম, নিচে আইকনসহ ৫ ট্যাব। সব জায়গায় বড় টাচ-সাইজ। */
:root{
  --bg:#eef2f7; --card:#ffffff; --ink:#0f1b33; --mut:#64708a; --line:#e2e8f1; --soft:#edf3fa;
  --acc:#0b6fc2; --onacc:#ffffff; --good:#0a8a5c; --bad:#d02847; --warn:#b36a00;
  --goodbg:#e2f6ed; --badbg:#fde8ec; --warnbg:#fcf0d9;
  --hero-a:#0b132b; --hero-b:#14407a; --hero-c:#0e86b8; --onhero:#ffffff;
  --shadow:0 1px 2px rgba(15,27,51,.05),0 6px 18px rgba(15,27,51,.06);
  --f-body:'Hind Siliguri','Noto Sans Bengali',system-ui,sans-serif; --f-num:'JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#080e1d; --card:#111a30; --ink:#e8edf7; --mut:#93a0b8; --line:#222f49; --soft:#182642;
  --acc:#4cb4ea; --onacc:#06121f; --good:#3ccf98; --bad:#ff7088; --warn:#f0b04a;
  --goodbg:#0f2f29; --badbg:#3a1a24; --warnbg:#392c12; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#080e1d; --card:#111a30; --ink:#e8edf7; --mut:#93a0b8; --line:#222f49; --soft:#182642;
  --acc:#4cb4ea; --onacc:#06121f; --good:#3ccf98; --bad:#ff7088; --warn:#f0b04a;
  --goodbg:#0f2f29; --badbg:#3a1a24; --warnbg:#392c12; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;padding-block:0 28px}
button,input,select,textarea{font:inherit;color:inherit}
svg.ic{width:1.25em;height:1.25em;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.wrap{max-width:760px;margin:0 auto}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(100deg,var(--hero-a),var(--hero-b));color:var(--onhero);padding-block:12px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hero-a);z-index:30}
main{padding-block:14px 0}
.hd{display:flex;align-items:center;gap:10px}
.logo{width:42px;height:42px;border-radius:13px;background:#fff;padding:3px;object-fit:contain;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.25)}
header.top h1{font-size:18px;margin:0;font-weight:700;flex:1;min-width:0;line-height:1.2}
header.top h1 small{display:block;font-size:11.5px;font-weight:500;opacity:.7}
.ib{border:1px solid var(--line);background:var(--card);border-radius:12px;width:40px;height:40px;cursor:pointer;display:grid;place-items:center;color:var(--ink);flex:none}
header .ib{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.18);color:#fff}
.sync{font-size:11px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--soft);color:var(--mut);white-space:nowrap}
header .sync{background:rgba(255,255,255,.14);color:#fff}
header .sync.ok{color:#8af3c6} header .sync.bad{color:#ff9fb0} header .sync.warn{color:#ffd48a}
.sync.ok{background:var(--goodbg);color:var(--good)} .sync.bad{background:var(--badbg);color:var(--bad)} .sync.warn{background:var(--warnbg);color:var(--warn)}
header .sync.ok,header .sync.bad,header .sync.warn{background:rgba(255,255,255,.14)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);min-width:0}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;min-width:0}
.between{justify-content:space-between}
.wrapr{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mut{color:var(--mut)} .sm{font-size:12.5px} .b{font-weight:700}
.good{color:var(--good)} .bad{color:var(--bad)} .warnc{color:var(--warn)}
h2{font-size:12.5px;font-weight:700;margin:8px 4px -4px;color:var(--mut);letter-spacing:.06em}
.hero{background:linear-gradient(135deg,var(--hero-a) 0%,var(--hero-b) 62%,var(--hero-c) 130%);color:var(--onhero);border:0;padding:20px 18px 16px;border-radius:22px;box-shadow:0 10px 28px rgba(11,40,90,.28)}
.hero .big{font-size:38px;font-weight:700;line-height:1.1;margin:6px 0 2px}
.hero .mut{color:inherit;opacity:.72}
.hero .tri{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.hero .tri div{background:rgba(255,255,255,.12);border-radius:13px;padding:9px 10px;min-width:0}
.hero .tri small{display:block;font-size:11px;opacity:.75}
.hero .tri b{font-size:14px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--mut)}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--mut);white-space:nowrap}
.pill.good{background:var(--goodbg);color:var(--good)} .pill.bad{background:var(--badbg);color:var(--bad)} .pill.warn{background:var(--warnbg);color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 15px;cursor:pointer;font-size:13.5px;font-weight:500}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--onacc);font-weight:600}
.chip.rm{padding-right:10px}
.btn{border:0;background:linear-gradient(135deg,var(--hero-c),var(--acc));color:#fff;border-radius:13px;padding:12px 18px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn.ghost{background:var(--soft);color:var(--acc)}
.btn.danger{background:var(--badbg);color:var(--bad)}

    + (withBal.length ? '<div><b class="sm mut">সব লেনদেন (নতুন আগে)</b>' + withBal.map(x => { const e = x.e; return '<div class="kv" style="align-items:center"><span style="color:var(--ink)"><b>' + fd(e.date) + '</b> <span class="pill ' + LK[entryKind(e)].pill + '">' + LK[entryKind(e)].t + '</span> ' + wPill(e.w || 'w_counter') + (e.note ? '<div class="mut sm">' + esc(e.note) + '</div>' : '') + '<div class="mut sm">তখন বাকি: ' + money(Math.abs(x.run)) + (x.run < 0 ? ' (আমি দেব)' : (x.run > 0 ? ' (আমি পাব)' : ' (মিটে গেছে)')) + '</div></span><span class="row"><b class="num">' + money(e.amt) + '</b><button class="x" onclick="rmEntry(\'' + id + '\',\'' + e.id + '\')" aria-label="মুছুন">✕</button></span></div>'; }).join('') + '</div>' : '')
    + '<button class="btn danger block" onclick="arm(this,function(){delPerson(\'' + id + '\')})">এই ব্যক্তির পুরো হিসাব মুছুন</button>');
}
function addEntry(id, close) {
  const a = n(val('l_amt')); if (a <= 0) { toast('টাকার অংক দিন'); return; }
  const k = LK[window._dir] ? window._dir : 'lend'; S.loans[id].entries.push({ id: uid(), date: val('l_date') || today(), amt: a, dir: LK[k].dir, kind: k, w: val('l_w') || 'w_counter', note: val('l_note').trim() }); save('loans', id);
  if (close) { closeSheet(); toast('সেভ হয়েছে'); } else loanSheet(id);
}
function rmEntry(id, eid) { S.loans[id].entries = S.loans[id].entries.filter(e => e.id !== eid); save('loans', id); loanSheet(id); }
function delPerson(id) { remove('loans', id); closeSheet(); }

/* ===== ৫) ভিসা (অটো) ===== */
function vVisa() {
  if (MODE !== 'cloud') return '<div class="card stack"><b>ভিসা ফাইলের হিসাব অটো আসতে লগইন লাগবে</b><span class="mut sm">ভিসা অ্যাপে যে ফাইল আপলোড করেন, তার বিল, জমা ও লাভ এখানে নিজে নিজে আসে। ভিসা অ্যাপের ইমেইল দিয়ে লগইন করুন।</span><button class="btn" onclick="logout(true)">লগইন পেজে যান</button></div>';
  const r = VISA.rows; const rl = (UI.vm && UI.vm !== 'all') ? r.filter(x => UI.vm === 'REFDUE' ? (x.mode === 'RETURNED' && x.refDue > 0.001) : x.mode === UI.vm) : r; const t = r.reduce((a, x) => { a.bill += x.bill; a.paid += x.paid; a.due += (x.mode === 'RUNNING' ? 0 : x.due); a.profit += x.profit; return a; }, { bill: 0, paid: 0, due: 0, profit: 0 });
  const mc = { DELIVERED: ['ডেলিভারড', 'good'], APPOINTED: ['অ্যাপয়েন্টেড', 'warn'], RUNNING: ['চলমান', ''], RETURNED: ['ফেরত', 'bad'] };
  return (VISA.err ? '<div class="card sm ' + (VISA.err === 'PERM' ? 'bad' : 'warnc') + '">' + (VISA.err === 'PERM' ? 'ভিসা ফাইল পড়ার পারমিশন নেই' : 'নেট সমস্যা, আগের তথ্য দেখাচ্ছে') + '</div>' : '')
    + '<div class="card hero"><div class="mut sm">ভিসা থেকে মোট লাভ</div><div class="big num">' + money(t.profit) + '</div><div class="mut sm">বিল ' + money(t.bill) + ' · জমা ' + money(t.paid) + ' · বাকি ' + money(t.due) + '</div></div>'
    + vSt(r) + '<div class="chips">' + [['all', 'সব (' + r.length + ')'], ['RUNNING', 'চলমান'], ['APPOINTED', 'অ্যাপয়েন্টেড'], ['DELIVERED', 'ডেলিভারড'], ['RETURNED', 'ফেরত'], ['REFDUE', '🔴 ফেরত বাকি (' + r.filter(x => x.mode === 'RETURNED' && x.refDue > 0.001).length + ')']].map(x => '<button type="button" class="chip' + ((UI.vm || 'all') === x[0] ? ' on' : '') + '" onclick="UI.vm=\'' + x[0] + '\';render()">' + x[1] + '</button>').join('') + '</div>'
    + '<button class="btn ghost" onclick="loadVisa(true).then(render)">🔄 আবার আনুন</button>'
    + (rl.length ? rl.slice().sort((a, b) => (Number(b.serial) || 0) - (Number(a.serial) || 0)).map(x => '<div class="card"><div class="row between"><span class="nm" style="font-weight:700;font-size:16px">' + (x.serial ? '#' + esc(x.serial) + ' ' : '') + esc(x.name) + (x.more ? ' +' + x.more : '') + '</span><span class="pill ' + mc[x.mode][1] + '">' + mc[x.mode][0] + '</span></div>' + visaCardSplitHtml(x) + '</div>').join('') : '<div class="empty">ভিসা ফাইল পাওয়া যায়নি</div>')
    + '<p class="mut sm" style="text-align:center">লাভ ধরা হয় ডেলিভারড বা অ্যাপয়েন্টেড ফাইলে (বিল − ভিসা ফি − সফটওয়্যার চার্জ), ফেরত ফাইলে রাখা চার্জ।</p>';
}

/* ভিসা অবস্থা অনুযায়ী হিসাব: চলমান / অ্যাপয়েন্টেড / ডেলিভারড / ফেরত। ফেরত ফাইলের বিল পাবতে ধরা হয় না, রাখা চার্জ আয়। */
function vSt(r) {
  const ag = m => r.filter(x => x.mode === m).reduce((a, x) => { a.n++; a.bill += x.bill; a.paid += x.paid; a.due += x.due; a.profit += x.profit; a.refund += n(x.refund); if (m === 'RETURNED') a.rd += visaHeld(x); return a; }, { n: 0, bill: 0, paid: 0, due: 0, profit: 0, refund: 0, rd: 0 });
  const card = (t, a, rows) => '<div class="card stack" style="gap:2px;padding:12px"><div class="row between"><b class="sm">' + t + '</b><span class="pill">' + a.n + 'টি</span></div>' + rows + '</div>';
  const R = ag('RUNNING'), A = ag('APPOINTED'), D = ag('DELIVERED'), X = ag('RETURNED');
  return '<div class="grid2">'
    + card('📂 চলমান', R, kv('বিল', money(R.bill)) + kv('জমা', money(R.paid), 'good') + kv('পেতে পারি (Appt হলে)', money(R.due), 'mut'))
    + card('📅 অ্যাপয়েন্টেড', A, kv('বিল', money(A.bill)) + kv('জমা', money(A.paid), 'good') + kv('বাকি (পাব)', money(A.due), A.due ? 'bad' : '') + kv('লাভ', money(A.profit), 'good'))
    + card('📦 ডেলিভারড', D, kv('বিল', money(D.bill)) + kv('জমা', money(D.paid), 'good') + kv('বাকি (পাব)', money(D.due), D.due ? 'bad' : '') + kv('লাভ', money(D.profit), 'good'))
    + card('🔙 ফেরত', X, kv('জমা ছিল', money(X.paid)) + kv('রাখা চার্জ (আয়)', money(X.profit), 'good') + kv('ফেরত দিয়েছি', money(X.refund)) + kv('ফেরত দিতে বাকি', money(X.rd), X.rd > 0.001 ? 'bad' : 'good'))
    + '</div><p class="mut sm" style="margin:0">ফেরত ফাইলের বিল পাব-তে ধরা হয় না; ফেরত দেওয়ার সময় যে চার্জ রাখা হয় সেটাই আয়।</p>';
}
/* ===== ভিসা জমা: কাস্টমারের কত টাকা এখন আমার কাছে আছে ===== */
// ডেলিভারির আগে (চলমান/অ্যাপয়েন্টেড) জমা = কাস্টমারের গচ্ছিত টাকা। ডেলিভারড ফাইলে বিলের চেয়ে বেশি জমা, আর ফেরত ফাইলে (জমা − রাখা চার্জ − ফেরত দেওয়া) বাকি থাকলে সেটাও আমার কাছে কাস্টমারের টাকা।
// ফেরত ফাইলের হাইলাইট: জমা − রাখা চার্জ = ক্লায়েন্টকে দিতে হবে; সত্যিই দেওয়া হয়েছে কিনা এক নজরে
function visaRefBanner(x) {
  const should = n(x.refShould), due = n(x.refDue), given = n(x.refund);
  let bg, fg, txt;
  if (should <= 0.001) { bg = 'var(--soft)'; fg = 'var(--mut)'; txt = 'ফেরত দেওয়ার মতো টাকা নেই — পুরো জমা চার্জ হিসেবে রাখা হয়েছে'; }
  else if (due <= 0.001) { bg = 'var(--goodbg)'; fg = 'var(--good)'; txt = '✅ পুরো ফেরত দেওয়া হয়েছে — ' + money(given); }
  else if (given > 0.001) { bg = 'var(--warnbg)'; fg = 'var(--warn)'; txt = '⚠ আংশিক ফেরত — ' + money(given) + ' দেওয়া হয়েছে, আরও ' + money(due) + ' দিতে হবে'; }
  else { bg = 'var(--badbg)'; fg = 'var(--bad)'; txt = '🔴 ফেরত দেওয়া হয়নি — ' + money(should) + ' ফেরত দিতে হবে'; }
  return '<div style="background:' + bg + ';color:' + fg + ';border:2px solid ' + fg + ';border-radius:12px;padding:9px 12px;font-weight:700;font-size:13.5px">' + txt
    + (should > 0.001 ? '<div class="sm" style="font-weight:500;margin-top:3px;opacity:.9">জমা ' + money(x.paid) + ' − রাখা চার্জ ' + money(x.kept) + ' = ফেরত দিতে হবে ' + money(should) + ' · দেওয়া ' + money(given) + ' · বাকি ' + money(due) + '</div>' : '') + '</div>';
}
function visaHeld(x) {
  const paid = n(x.paid);
  if (x.mode === 'RETURNED') return Math.max(0, paid - n(x.kept) - n(x.refund));
  if (x.mode === 'DELIVERED' || x.mode === 'APPOINTED') return Math.max(0, paid - n(x.bill));
  return paid;
}
function vJoma() {
  if (MODE !== 'cloud') return '<div class="card stack"><b>ভিসা জমার হিসাব দেখতে লগইন লাগবে</b><span class="mut sm">ভিসা অ্যাপে যে জমা এন্ট্রি দেন, তা এখানে নিজে নিজে আসে। ভিসা অ্যাপের ইমেইল দিয়ে লগইন করুন।</span><button class="btn" onclick="logout(true)">লগইন পেজে যান</button></div>';
  const rows = VISA.rows.map(x => Object.assign({}, x, { held: visaHeld(x) }));
  const T = { held: 0, run: 0, appt: 0, over: 0, paid: 0, due: 0, nHeld: 0, nDue: 0 };
  rows.forEach(x => { T.paid += n(x.paid); if (x.mode !== 'RUNNING') { T.due += n(x.due); if (x.due > 0.001) T.nDue++; } if (x.held > 0.001) { T.held += x.held; T.nHeld++; if (x.mode === 'RUNNING') T.run += x.held; else if (x.mode === 'APPOINTED') T.appt += x.held; else T.over += x.held; } });
  const f = UI.vf || 'held', q = (UI.vq || '').trim().toLowerCase();
  let list = rows.filter(x => f === 'held' ? x.held > 0.001 : (f === 'due' ? (x.due > 0.001 && x.mode !== 'RUNNING') : true));
  if (q) list = list.filter(x => (String(x.name) + ' ' + String(x.serial)).toLowerCase().includes(q));
  list.sort((a, b) => (f === 'due' ? b.due - a.due : b.held - a.held) || (Number(b.serial) || 0) - (Number(a.serial) || 0));
  const mc = { DELIVERED: ['ডেলিভারড', 'good'], APPOINTED: ['অ্যাপয়েন্টেড', 'warn'], RUNNING: ['চলমান', ''], RETURNED: ['ফেরত', 'bad'] };
  const note = x => x.mode === 'RUNNING' ? 'অ্যাপয়েন্টমেন্ট হয়নি — এই জমা এখনো আমার না, ফেরত দিতে হতে পারে' : (x.mode === 'APPOINTED' ? 'অ্যাপয়েন্টেড — বিল পর্যন্ত জমা আমার; বিলের চেয়ে বেশি জমা ফেরত দিতে হবে' : (x.mode === 'DELIVERED' ? 'বিলের চেয়ে বেশি জমা — কাস্টমারকে ফেরত দিতে হবে' : 'ফেরত ফাইল — রাখা চার্জ ও ফেরতের পরেও এই টাকা বাকি'));
  const chip = (k, t) => '<button type="button" class="chip' + (f === k ? ' on' : '') + '" onclick="UI.vf=\'' + k + '\';render()">' + t + '</button>';
  return (VISA.err ? '<div class="card sm ' + (VISA.err === 'PERM' ? 'bad' : 'warnc') + '">' + (VISA.err === 'PERM' ? 'ভিসা ফাইল পড়ার পারমিশন নেই' : 'নেট সমস্যা, আগের তথ্য দেখাচ্ছে') + '</div>' : '')
    + '<div class="card hero"><div class="sm" style="opacity:.75">ভিসা কাস্টমারের জমা — এখন আমার কাছে আছে</div><div class="big num">' + money(T.held) + '</div><div class="sm" style="opacity:.75">' + T.nHeld + ' জন কাস্টমারের টাকা · মোট জমা পেয়েছি ' + money(T.paid) + '</div>'
    + '<div class="tri"><div><small>চলমান (ফেরত হতে পারে)</small><b class="num">' + money(T.run) + '</b></div><div><small>অ্যাপয়েন্টেডে বেশি জমা</small><b class="num">' + money(T.appt) + '</b></div><div><small>ফেরত দিতে হবে</small><b class="num">' + money(T.over) + '</b></div></div></div>'
    + '<div class="chips">' + chip('held', 'আমার কাছে জমা আছে (' + T.nHeld + ')') + chip('due', 'কাস্টমারের বাকি (' + T.nDue + ')') + chip('all', 'সব (' + rows.length + ')') + '</div>'
    + '<div class="field"><input id="v_q" type="search" placeholder="🔍 নাম বা সিরিয়াল দিয়ে খুঁজুন" value="' + esc(UI.vq || '') + '" oninput="UI.vq=this.value;reFocus(\'v_q\')" aria-label="কাস্টমার খুঁজুন"></div>'
    + '<button class="btn ghost" onclick="loadVisa(true).then(render)">🔄 আবার আনুন</button>'
    + (list.length ? list.map(x => '<div class="card stack" style="gap:10px"><div class="row between"><span class="nm" style="font-weight:700">' + (x.serial ? '#' + esc(x.serial) + ' ' : '') + esc(x.name) + (x.more ? ' +' + x.more : '') + '</span><span class="pill ' + mc[x.mode][1] + '">' + mc[x.mode][0] + '</span></div>'
      + '<div class="row between"><div><div class="sm mut">আমার কাছে কাস্টমারের টাকা</div><b class="num ' + (x.held > 0.001 ? 'good' : 'mut') + '" style="font-size:22px">' + money(x.held) + '</b></div>' + (x.last ? '<div class="sm mut" style="text-align:right">শেষ জমা<br><b>' + fd(x.last) + '</b></div>' : '') + '</div>'
      + '<div class="mini num" style="grid-template-columns:repeat(3,1fr)"><div><small>' + (x.mode === 'RETURNED' ? 'রাখা চার্জ' : 'বিল') + '</small><b>' + Math.round(x.mode === 'RETURNED' ? x.kept : x.bill) + '</b></div><div><small>মোট জমা</small><b class="good">' + Math.round(x.paid) + '</b></div><div><small>' + (x.mode === 'RUNNING' ? 'পেতে পারি' : 'বাকি') + '</small><b class="' + (x.due && x.mode !== 'RUNNING' ? 'bad' : 'mut') + '">' + Math.round(x.due) + '</b></div></div>'
      + (x.mode === 'RETURNED' ? visaRefBanner(x) : (x.held > 0.001 ? '<div class="sm mut">' + note(x) + '</div>' : '')) + '</div>').join('') : '<div class="empty">' + (q ? 'এই নামে কিছু পাওয়া যায়নি' : (f === 'held' ? 'এখন কোনো কাস্টমারের জমা টাকা আমার কাছে নেই' : (f === 'due' ? 'কোনো কাস্টমারের বাকি নেই' : 'ভিসা ফাইল পাওয়া যায়নি'))) + '</div>')
    + '<p class="mut sm" style="text-align:center;margin:0">হিসাব: অ্যাপয়েন্টমেন্টের আগে (চলমান ফাইলে) যত জমা নিয়েছেন সবটাই কাস্টমারের গচ্ছিত টাকা — ফেরত দিতে হতে পারে। অ্যাপয়েন্টমেন্ট হলে বিল পর্যন্ত টাকা আপনার, বেশি জমা থাকলে সেটা ফেরত দেওয়ার টাকা। ফেরত ফাইলে জমা − রাখা চার্জ − ফেরত দেওয়া যা বাকি তাও কাস্টমারের টাকা। জমা এন্ট্রি ভিসা অ্যাপ থেকেই আসে।</p>';
}

/* ===== সেটিংস ===== */
function vSet() {
  const st = S.settings;

  const b = new Blob(['﻿' + rows.map(r => r.map(cell).join(',')).join('\r\n')], { type: 'text/csv;charset=utf-8' });

}

/* ---------- ক্যাশ মডেল ----------
   এক ক্যাশ + এক দিন: দিন শেষে লেখা টাকা (end) আর প্রতিটি এন্ট্রিতে ওই স্টাফের নামে নেওয়া টাকা (item) — দুটোর বড়টাই "এসেছে" (coll)।
   এন্ট্রির বাইরের অংশ (extra = coll − item) আলাদা আয় হিসেবে ধরা হয়, যাতে দুবার গোনা না হয়। */
function cashModel() {
  const A = cashAccts(), byO = {}, ids = {}; A.forEach(a => { ids[a.id] = 1; if (a.owner) byO[a.owner] = a.id; });
  const day = {}; const cell = (d, id) => { const o = day[d] || (day[d] = {}); return o[id] || (o[id] = { item: 0, end: 0, has: false, note: '', by: '', coll: 0, extra: 0 }); };
  Object.values(S.cnt).forEach(c => arr(c.payments).forEach(p => { const id = byO[p && p.by]; if (id && p.date) cell(p.date, id).item += n(p.amt); }));
  Object.values(S.cday).forEach(e => { if (!e || !e.date || !ids[e.acct]) return; const x = cell(e.date, e.acct); x.end = n(e.amt); x.has = true; x.note = e.note || ''; x.by = e.by || ''; });
  const acc = {}; A.forEach(a => { acc[a.id] = { a, coll: 0, extra: 0, out: 0, inn: 0, bal: 0 }; });
  Object.keys(day).forEach(d => Object.keys(day[d]).forEach(id => { const x = day[d][id]; x.coll = Math.max(x.end, x.item); x.extra = Math.max(0, x.coll - x.item); acc[id].coll += x.coll; acc[id].extra += x.extra; }));
  Object.values(S.cmv).forEach(m => { const x = m && acc[m.acct]; if (!x) return; if (m.dir === 'in') x.inn += n(m.amt); else x.out += n(m.amt); });
  const tot = { coll: 0, out: 0, inn: 0, bal: 0 };
  Object.values(acc).forEach(x => { x.bal = x.coll + x.inn - x.out; tot.coll += x.coll; tot.out += x.out; tot.inn += x.inn; tot.bal += x.bal; });
  return { A, day, acc, tot };
}

    '<div class="sm" style="background:var(--warnbg);color:var(--ink);padding:9px 11px;border-radius:9px;border:1px solid var(--warn)"><b>🛡️ ভুল রোধী অটো-হিসাব:</b> কাস্টমার জমা দিয়েছিল <b>' + money(v.paid) + '</b>। আপনি যদি কিছু টাকা চার্জ রাখেন (যেমন ৫০০ টাকা), তবে কাস্টমারকে ফেরত দেবেন <b>' + money(v.paid) + ' − চার্জ</b> (যেমন ১৫০০ টাকা)। ভুলে যেন ২০০০ ফেরত + ৫০০ চার্জ না হয়, তাই নিচে চার্জ লিখলেই ফেরত টাকা অটো বসে যাবে!</div>'
    + '<div class="grid2"><div class="field"><label for="vrm_paid">কাস্টমার মোট জমা দিয়েছিল (৳)</label><input id="vrm_paid" type="number" value="' + v.paid + '" readonly style="background:var(--bg);font-weight:800"></div><div class="field"><label for="vrm_date">ফেরত দেওয়ার তারিখ (দৈনিক হিসাবের জন্য)</label><input id="vrm_date" type="date" value="' + (cur.refDate || v.last || UI.dhd || today()) + '"></div></div>'
    + '<div class="grid2"><div class="field"><label for="vrm_kept">১. আমাদের রাখা চার্জ — রেভিনিউ (৳)</label><input id="vrm_kept" type="number" inputmode="decimal" value="' + v.kept + '" oninput="onVrmMath(\'kept\')"></div><div class="field"><label for="vrm_ref">২. কাস্টমারকে ফেরত দিলাম — ক্যাশ থেকে যাবে (৳)</label><input id="vrm_ref" type="number" inputmode="decimal" value="' + (v.refund > 0 ? v.refund : Math.max(0, v.paid - v.kept)) + '" oninput="onVrmMath(\'ref\')"></div></div>'
    + '<div class="card sm" style="box-shadow:none;background:var(--bg)" id="vrm_preview"></div>'
    + wFieldHtml('vrm_w', cur.refW || 'w_visacash', 'কোন ড্রয়ার / বিকাশ / ব্যাংক থেকে ফেরত দিলেন')
    + '<div class="field"><label for="vrm_note">📝 ফেরতের নোট (ঐচ্ছিক)</label><input id="vrm_note" value="' + esc(cur.refNote || '') + '" placeholder="যেমন: স্লট না পাওয়ায় ফেরত / বিকাশে ফেরত"></div>'
    + '<button class="btn block" onclick="saveVisaReturnMeta(\'' + vid + '\')">✅ ফেরত ও রাখা চার্জ সেভ করুন (দৈনিক হিসাবে তুলুন)</button>');
  onVrmMath('init');
}
function onVrmMath(mode) {
  const paid = Math.max(0, n(val('vrm_paid')));
  let kept = Math.max(0, n(val('vrm_kept')));
  let ref = Math.max(0, n(val('vrm_ref')));
  if (mode === 'kept') {
    if (kept > paid) { kept = paid; $('vrm_kept').value = kept; toast('⚠ রাখা চার্জ জমার (' + money(paid) + ') চেয়ে বেশি হতে পারবে না!'); }
    ref = Math.max(0, paid - kept);
    $('vrm_ref').value = ref;
  } else if (mode === 'ref') {
    if (ref > paid) { ref = paid; $('vrm_ref').value = ref; toast('⚠ ফেরত টাকা জমার (' + money(paid) + ') চেয়ে বেশি হতে পারবে না!'); }
    kept = Math.max(0, paid - ref);
    $('vrm_kept').value = kept;
  } else {
    if (kept + ref > paid) { kept = Math.min(paid, kept); ref = Math.max(0, paid - kept); $('vrm_kept').value = kept; $('vrm_ref').value = ref; }
  }
  const el = $('vrm_preview');
  if (el) el.innerHTML = 'জমা ছিল: <b>' + money(paid) + '</b> − রাখা চার্জ (আপনার রেভিনিউ): <b class="good">' + money(kept) + '</b> = কাস্টমারকে ফেরত (দৈনিক ক্যাশ থেকে কমবে): <b class="bad">−' + money(ref) + '</b>';
}
function saveVisaReturnMeta(vid) {
  const paid = Math.max(0, n(val('vrm_paid')));
  let kept = Math.max(0, n(val('vrm_kept')));
  let ref = Math.max(0, n(val('vrm_ref')));
  if (kept + ref > paid + 0.001) {
    toast('❌ ভুল রোধ: রাখা চার্জ (' + money(kept) + ') ও ফেরত (' + money(ref) + ') এর যোগফল জমার (' + money(paid) + ') চেয়ে বেশি হতে পারবে না!');
    return;
  }
  const cur = vMetaOf(vid);
  cur.id = vid;
  cur.forceMode = 'RETURNED';
  cur.keptOverride = kept;
  cur.refOverride = ref;
  cur.refDate = val('vrm_date') || today();
  cur.refW = val('vrm_w') || 'w_visacash';
  cur.refNote = val('vrm_note').trim();
  cur.updatedAt = Date.now();
  S.vmeta[vid] = cur;
  const idx = VISA.rows.findIndex(x => x.id === vid);
  if (idx !== -1 && VISA.raw && VISA.raw[vid]) {
    VISA.rows[idx] = visaRow(VISA.raw[vid]);
  } else if (idx !== -1) {
    VISA.rows[idx].mode = 'RETURNED';
    VISA.rows[idx].kept = kept;
    VISA.rows[idx].profit = kept;
    VISA.rows[idx].refund = ref;
    VISA.rows[idx].refShould = Math.max(0, paid - kept);
    VISA.rows[idx].refDue = Math.max(0, paid - kept - ref);
  }
  save('vmeta', vid);
  closeSheet();
  toast('✅ ভিসা ফেরত (' + money(ref) + ') ও রাখা চার্জ (' + money(kept) + ') সেভ হয়েছে এবং দৈনিক হিসাবে যুক্ত হয়েছে!');
}
function visaPayWSheet(vid, pkey, curW, label, amt) {
  sheet('ভিসা জমার ড্রয়ার/ব্যাংক — ' + esc(label),
    '<div class="mut sm">কাস্টমারের দেওয়া ' + money(amt) + ' কোন ড্রয়ার, বিকাশ, নগদ বা ব্যাংকে রেখেছেন তা সিলেক্ট করুন:</div>'
    + wFieldHtml('vpw_w', curW || 'w_visacash', 'কোন ড্রয়ার / বিকাশ / ব্যাংক')
    + '<button class="btn block" onclick="saveVisaPayW(\'' + vid + '\',\'' + pkey + '\')">সেভ করুন</button>');
}
function saveVisaPayW(vid, pkey) {
  const cur = vMetaOf(vid); cur.id = vid; cur.payW = cur.payW || {};
  cur.payW[pkey] = val('vpw_w') || 'w_visacash';

/* ---------- দৈনিক হিসাব ইঞ্জিন: যেকোনো তারিখ D এর জন্য প্রতি ড্রয়ার/ব্যাংকের ওপেনিং, জমা (+), খরচ (−) এবং ক্লোজিং ---------- */
function allTxForDate(D) {
  const list = [];
  const push = (w, dir, amt, cat, title, sub, isRev, editJs, unsetW) => {
    if (n(amt) <= 0) return;
    list.push({ w: w || 'w_counter', dir, amt: n(amt), cat, title, sub: sub || '', isRev: !!isRev, editJs: editJs || '', unsetW: !!unsetW });
  };

  // ১. পাসপোর্ট ফাইল: ক্লায়েন্ট জমা (+), ফেরত (−), এবং চালান যদি ওই দিনে হয়
  Object.values(S.files).forEach(f => {
    const c = fileCalc(f);
    arr(f.payments).forEach(p => {
      if (p && p.date === D) push(p.w || 'w_passdoc', 'in', p.amt, 'পাসপোর্ট জমা', f.name || 'পাসপোর্ট ক্লায়েন্ট', (p.note ? '📝 ' + p.note + ' · ' : '') + 'মোট বিল ' + money(c.bill) + (c.due ? ' · বাকি ' + money(c.due) : ' · পুরো জমা'), false, "fileForm('" + f.id + "')");
    });
    arr(f.refunds).forEach(r => {
      if (r && r.date === D) push(r.w || 'w_passdoc', 'out', r.amt, 'পাসপোর্ট ফেরত', f.name || 'পাসপোর্ট ক্লায়েন্ট', (r.note ? '📝 ' + r.note + ' · ' : '') + 'রাখা চার্জ (আয়) ' + money(c.kept), false, "fileForm('" + f.id + "')");
    });
    if (f.challan && f.challanDate === D && n(f.passFee) > 0 && (f.challanW || !isMultiW())) {
      push(f.challanW || 'w_passdoc', 'out', f.passFee, 'পাসপোর্ট চালান ফি', f.name || 'পাসপোর্ট', (f.challanNote ? '📝 ' + f.challanNote + ' · ' : '') + 'সরকারি চালান খরচ (ফাইল ফর্ম থেকে)', false, "fileForm('" + f.id + "')");
    } else if (f.ret && f.retSpent && n(f.retCost) > 0 && (f.retDate || f.appDate) === D) {
      push('w_passdoc', 'out', f.retCost, 'ফেরত পাসপোর্টের খরচ', f.name || 'পাসপোর্ট', 'ফেরত ফাইলে আগে হয়ে যাওয়া খরচ', false, "fileForm('" + f.id + "')");
    }
  });

  // ২. পাসপোর্ট IP পেমেন্ট (−)
  Object.values(S.ipPays).forEach(p => {
    if (p && p.date === D) push(p.w || 'w_ipres', 'out', p.amt, 'পাসপোর্ট IP পেমেন্ট (রিজার্ভ থেকে)', 'IP পরিশোধ', (p.wk ? fd(p.wk) + ' সপ্তাহের IP' : '') + (p.note ? ' · 📝 ' + p.note : ''), false, "ipPaySheet(null,'" + p.id + "')");
  });

  // ৩. ডকুমেন্ট কাজ: ক্লায়েন্ট জমা (+), ফেরত (−), কাজের খরচ (−)
  Object.values(S.docs).forEach(d => {
    const c = docCalc(d);
    arr(d.payments).forEach(p => {
      if (p && p.date === D) push(p.w || 'w_passdoc', 'in', p.amt, 'ডকুমেন্ট জমা', (d.name || 'ক্লায়েন্ট') + ' (' + (d.cat || 'ডকুমেন্ট') + ')', (p.note ? '📝 ' + p.note + ' · ' : '') + (p.by ? 'স্টাফ: ' + p.by + ' · ' : '') + (c.due ? 'বাকি ' + money(c.due) : 'পুরো জমা'), false, "djForm('" + d.id + "')");
    });
    arr(d.refunds).forEach(r => {
      if (r && r.date === D) push(r.w || 'w_passdoc', 'out', r.amt, 'ডকুমেন্ট ফেরত', (d.name || 'ক্লায়েন্ট') + ' (' + (d.cat || 'ডকুমেন্ট') + ')', (r.note ? '📝 ' + r.note + ' · ' : '') + 'রাখা চার্জ ' + money(c.kept), false, "djForm('" + d.id + "')");
    });
    arr(d.spends).forEach(sp => {
      if (sp && sp.date === D) push(sp.w || 'w_passdoc', 'out', sp.amt, 'ডকুমেন্ট কাজের খরচ', (d.name || 'ক্লায়েন্ট') + ' (' + (d.cat || 'ডকুমেন্ট') + ')', (sp.note ? sp.note + ' · ' : '') + (sp.by || ''), false, "djForm('" + d.id + "')");
    });
    if (!arr(d.spends).length && d.costDone && n(d.cost) > 0 && (d.costDate || d.doneDate || d.recvDate) === D) {
      push('w_passdoc', 'out', n(d.cost), 'ডকুমেন্ট কাজের খরচ', (d.name || 'ক্লায়েন্ট') + ' (' + (d.cat || 'ডকুমেন্ট') + ')', 'কাজের ফর্মে খরচ টিক দেওয়া হয়েছে', false, "djForm('" + d.id + "')");
    }
  });

  // ৪. কাউন্টার এক্সট্রা সার্ভিস (রেভিনিউ): প্রতিটি এন্ট্রি ও দিন শেষের ক্যাশ
  Object.values(S.cnt).forEach(c => {
    arr(c.payments).forEach(p => {
      if (p && p.date === D) push(p.w || 'w_counter', 'in', p.amt, 'কাউন্টার এক্সট্রা সার্ভিস (আয়)', c.svc + (n(c.qty) > 1 ? ' × ' + n(c.qty) : ''), (p.note ? '📝 ' + p.note + ' · ' : '') + (c.name ? c.name + ' · ' : '') + (c.note || 'সরাসরি রেভিনিউ'), true, "cForm('" + c.id + "')");
    });
  });
  const CM = cashModel();
  if (CM.day[D]) {
    Object.keys(CM.day[D]).forEach(cid => {
      const x = CM.day[D][cid];
      if (x && x.extra > 0) {
        const ca = cashAccts().find(a => a.id === cid);
        push('w_counter', 'in', x.extra, 'কাউন্টার এক্সট্রা সার্ভিস (আয়)', (ca ? ca.name : 'কাউন্টার') + ' — সারাদিনের ক্যাশ আয়', x.note || 'সরাসরি রেভিনিউ', true, "cDate('" + D + "');go('cnt')");
      }
    });
  }

  // ৫. ভিসা ফাইল (অটো সিঙ্ক + মেটা): ভিসা জমা (+), ভিসা ফেরত (−), ভিসা অ্যাপয়েন্টমেন্ট খরচ (−)
  VISA.rows.forEach(v => {
    const vm = vMetaOf(v.id);
    arr(v.payList).forEach(p => {
      if (p.d === D && p.amt > 0) {
        const pw = (vm.payW && vm.payW[p.key]) || p.w || 'w_visacash';
        push(pw, 'in', p.amt, 'ভিসা টাকা জমা', (v.serial ? '#' + v.serial + ' ' : '') + v.name, (v.mode === 'RUNNING' ? 'গচ্ছিত ভিসা জমা (ভিসা অ্যাপ থেকে অটো)' : 'ভিসা বিল জমা (ভিসা অ্যাপ থেকে অটো)'), false, isMultiW() ? "visaPayWSheet('" + v.id + "','" + p.key + "','" + pw + "'," + jarg(v.name) + "," + p.amt + ")" : "go('visa')", isMultiW() && !((vm.payW && vm.payW[p.key]) || p.w));
      }
    });
    if (v.mode === 'RETURNED' && v.refund > 0) {
      const rDate = vm.refDate || v.last || v.date;
      if (rDate === D) {
        push(vm.refW || 'w_visacash', 'out', v.refund, 'ভিসা ফাইল ফেরত', (v.serial ? '#' + v.serial + ' ' : '') + v.name, (vm.refNote ? '📝 ' + vm.refNote + ' · ' : '') + 'জমা ছিল ' + money(v.paid) + ' − রাখা চার্জ (আমার রেভিনিউ) ' + money(v.kept) + ' = ফেরত ' + money(v.refund), false, "visaReturnSheet('" + v.id + "')");
      }
    }
    const fi = visaFeeInfo(v);
    if (fi.basePaid && fi.baseDate === D && fi.baseFee > 0) {
      push(fi.baseW || 'w_visacash', 'out', fi.baseFee, '১. ভিসা ফি (Base Visa Fee)', (v.serial ? '#' + v.serial + ' ' : '') + v.name, 'অ্যাপয়েন্টমেন্ট ভিসা ফি' + (fi.note ? ' · ' + fi.note : ''), false, "visaFeeSheet('" + v.id + "')");
    }
    if (fi.softPaid && fi.softDate === D && fi.softFee > 0) {
      push(fi.softW || 'w_visacash', 'out', fi.softFee, '২. ভিসা সফটওয়্যার চার্জ (Software Fee)', (v.serial ? '#' + v.serial + ' ' : '') + v.name, 'ভিসা সফটওয়্যার/স্লট খরচ' + (fi.note ? ' · ' + fi.note : ''), false, "visaFeeSheet('" + v.id + "')");
    }
  });

  // ৬. দোকান খরচ (−), ব্যক্তিগত খরচ (−), অন্য আয় (+)
  Object.values(S.expenses).forEach(e => {
    if (!e || e.date !== D) return;
    if (e.kind === 'income') push(e.w || 'w_counter', 'in', e.amt, 'অন্য সার্ভিস / আয়', e.cat || 'অন্য আয়', e.note || 'সরাসরি রেভিনিউ', true, "expForm('" + e.id + "')");
    else push(e.w || 'w_counter', 'out', e.amt, e.kind === 'shop' ? 'দোকান খরচ' : 'ব্যক্তিগত খরচ', e.cat || KIND[e.kind], e.note || '', false, "expForm('" + e.id + "')");
  });

  // ৭. বাকি খাতা (Loans): কেউ বাকি নিল / আমি ফেরত দিলাম (−) এবং কেউ ফেরত দিল / আমি নিলাম (+)
  Object.values(S.loans).forEach(l => {
    arr(l.entries).forEach(e => {
      if (!e || e.date !== D) return;
      const k = entryKind(e), info = LK[k];
      const isOut = (k === 'lend' || k === 'payback');
      push(e.w || 'w_counter', isOut ? 'out' : 'in', e.amt, 'বাকি খাতা (' + info.t + ')', l.person || 'বাকি খাতা', e.note || '', false, "loanSheet('" + l.id + "')");
    });
  });

  // ৮. সরাসরি দৈনিক ড্রয়ার/ব্যাংক কুইক এন্ট্রি, ক্যাশ-ইন/আউট (এক্সট্রা চার্জ সহ) ও ট্রান্সফার (S.wtx)
  Object.values(S.wtx).forEach(t => {
    if (!t || t.date !== D) return;
    if (t.type === 'transfer') {
      push(t.w, 'out', t.amt, 'ট্রান্সফার (গেল)', wName(t.w) + ' ➔ ' + wName(t.toW), t.note || 'ড্রয়ার/ব্যাংক ট্রান্সফার', false, "wtxSheet('" + t.id + "')");
      push(t.toW, 'in', t.amt, 'ট্রান্সফার (এল)', wName(t.w) + ' ➔ ' + wName(t.toW), t.note || 'ড্রয়ার/ব্যাংক ট্রান্সফার', false, "wtxSheet('" + t.id + "')");
    } else if (t.type === 'mfs_io') {
      const mfsW = t.mfsW || 'w_bkash', cashW = t.cashW || 'w_counter';
      const base = n(t.amt), fee = n(t.fee), totMfs = base + n(t.mfsExtra);
      if (t.subType === 'send_cost') {
        // বিকাশ/নগদ থেকে পেমেন্ট বা সেন্ড মানি করা হয়েছে, যেখানে চার্জসহ বিকাশ থেকে কেটেছে
        push(mfsW, 'out', base + fee, t.cat || 'বিকাশ/নগদ পেমেন্ট (চার্জসহ)', (t.client || 'বিকাশ/নগদ খরচ') + (fee > 0 ? ' (আসল ' + money(base) + ' + চার্জ ' + money(fee) + ')' : ''), t.note || '', false, "wtxSheet('" + t.id + "')");
      } else if (t.subType === 'cash_out_client') {
        // কাস্টমার আপনার বিকাশ/নগদে ক্যাশ-আউট বা সেন্ড করেছে (চার্জসহ), আপনি কাস্টমারকে ক্যাশ ড্রয়ার থেকে নগদ দিয়েছেন
        push(mfsW, 'in', totMfs, 'বিকাশ/নগদে জমা (চার্জসহ)', (t.client || 'ক্যাশ-আউট কাস্টমার') + (n(t.mfsExtra) > 0 ? ' (মূল ' + money(base) + ' + চার্জ ' + money(t.mfsExtra) + ')' : ''), t.note || 'বিকাশ/নগদে ঢুকেছে', false, "wtxSheet('" + t.id + "')");
        if (n(t.cashGiven) > 0) push(cashW, 'out', n(t.cashGiven), 'ক্যাশ ড্রয়ার থেকে নগদ প্রদান', t.client || 'ক্যাশ-আউট কাস্টমার', 'বিকাশ/নগদের বিপরীতে নগদ প্রদান', false, "wtxSheet('" + t.id + "')");
      } else if (t.subType === 'cash_in_client') {
        // কাস্টমারকে বিকাশ/নগদে টাকা পাঠিয়েছেন এবং কাস্টমার নগদ ক্যাশ (চার্জসহ) ড্রয়ারে দিয়েছে
        push(mfsW, 'out', base + (t.mfsCutFee ? fee : 0), 'বিকাশ/নগদ থেকে প্রেরণ', t.client || 'ক্যাশ-ইন কাস্টমার', t.note || '', false, "wtxSheet('" + t.id + "')");
        if (n(t.cashGot) > 0) push(cashW, 'in', n(t.cashGot), 'ক্যাশ ড্রয়ারে নগদ প্রাপ্তি (চার্জসহ)', (t.client || 'ক্যাশ-ইন কাস্টমার') + (fee > 0 ? ' (মূল ' + money(base) + ' + চার্জ ' + money(fee) + ')' : ''), t.note || '', false, "wtxSheet('" + t.id + "')");
      } else if (t.subType === 'mfs_extra_adj') {
        // দিন শেষে বিকাশ/নগদে ক্যাশ-ইন/আউটের কারণে যে এক্সট্রা টাকা/কমিশন যোগ বা বিয়োগ হয়েছে তার সরাসরি সমন্বয়
        push(mfsW, t.dir === 'out' ? 'out' : 'in', base, t.dir === 'out' ? 'বিকাশ/নগদ চার্জ সমন্বয় (−)' : 'বিকাশ/নগদ এক্সট্রা/কমিশন যোগ (+)', t.client || 'বিকাশ/নগদ চার্জ/কমিশন', t.note || 'ক্যাশ-ইন/আউট এক্সট্রা সমন্বয়', t.dir !== 'out', "wtxSheet('" + t.id + "')");
      }
    } else if (t.type === 'visa_return') {
      if (n(t.gross) > 0 && t.grossInToday) {
        push(t.w, 'in', t.gross, 'ভিসা জমা', t.client || 'ভিসা ক্লায়েন্ট', 'মোট জমা ছিল', false, "wtxSheet('" + t.id + "')");
      }
      if (n(t.amt) > 0) {
        push(t.w, 'out', t.amt, 'ভিসা ফাইল ফেরত', (t.client || 'ভিসা ফাইল ফেরত'), 'ফেরত দেওয়া হলো · চার্জ রাখা (আমার রেভিনিউ): ' + money(t.kept) + (t.note ? ' · ' + t.note : ''), false, "wtxSheet('" + t.id + "')");
      }
    } else {
      push(t.w, t.dir === 'out' ? 'out' : 'in', t.amt, t.cat || (t.dir === 'out' ? 'খরচ' : 'জমা'), t.client || t.cat || 'লেনদেন', t.note || '', !!t.isRev, "wtxSheet('" + t.id + "')");
    }
  });

  return list;
}

/* তারিখ D-এর শুরুতে প্রতিটি ড্রয়ার/ব্যাংকের ওপেনিং ব্যালেন্স:
   গুরুত্বপূর্ণ নিয়ম:
   - পুরনো (দৈনিক হিসাব শুরু করার আগের) পাসপোর্ট/ভিসা/ডকুমেন্ট এন্ট্রি কখনোই নিজে থেকে ওপেনিং ব্যালেন্সে যোগ/বিয়োগ হবে না!
   - ওপেনিং ব্যালেন্স শুরু হবে ০ (শূন্য) বা আপনার সেট করা শুরুর ব্যালেন্স থেকে।
   - কেবল যেদিন আপনি রাতের ক্লোজিং ব্যালেন্স (S.dclose) সেভ করবেন, তার পরের দিন থেকে সেই ক্লোজিং ব্যালেন্সই পরের দিনের ওপেনিং ব্যালেন্স হবে।
   - আর আপনি চাইলে যেকোনো দিন "🚀 নতুন করে শুরুর ব্যালেন্স বসান" বা "শুরুতে ছিল ✎" চেপে নিজের হাতের ব্যালেন্স দিয়ে নতুনভাবে শুরু করতে পারবেন। */
function dayReconcile(D) {
  const ws = wallets();
  const prevDates = Object.keys(S.dclose || {}).filter(d => d < D).sort();
  const curClose = S.dclose[D] || { counts: {}, customOpen: {}, openNote: {}, note: '', closed: false };
  const startDate = S.settings.dhStartDate || '';
  const txs = (startDate && D < startDate) ? [] : allTxForDate(D);
  const byW = {};

  ws.forEach(w => {
    let autoOpen = n(w.openBal), anchorDate = '';
    for (let i = prevDates.length - 1; i >= 0; i--) {
      const pd0 = prevDates[i];
      if (startDate && pd0 < startDate) continue;
      const dc = S.dclose[pd0];
      if (dc && dc.counts && dc.counts[w.id] !== undefined && dc.counts[w.id] !== '') {
        autoOpen = n(dc.counts[w.id]);
        anchorDate = pd0;
        break;
      } else if (dc && dc.customOpen && dc.customOpen[w.id] !== undefined && dc.customOpen[w.id] !== '') {
        autoOpen = n(dc.customOpen[w.id]);
        anchorDate = pd0;
        allTxForDate(pd0).forEach(t => { if (t.w === w.id) autoOpen += (t.dir === 'in' ? t.amt : -t.amt); });
        break;
      }
    }
    byW[w.id] = {
      w, autoOpen, open: autoOpen, anchorDate,
      hasCustomOpen: !!(curClose.customOpen && curClose.customOpen[w.id] !== undefined && curClose.customOpen[w.id] !== ''),
      openNote: (curClose.openNote && curClose.openNote[w.id]) || '',
      inn: 0, out: 0, expected: 0,
      actual: (curClose.counts && curClose.counts[w.id] !== undefined && curClose.counts[w.id] !== '') ? n(curClose.counts[w.id]) : null,
      hasActual: !!(curClose.counts && curClose.counts[w.id] !== undefined && curClose.counts[w.id] !== ''),
      diff: 0, txs: []
    };
  });

  if (prevDates.length > 0) {
    const anchors = ws.map(w => byW[w.id].anchorDate).filter(Boolean).sort(), histDates = [];
    if (anchors[0]) { let dd = addD(anchors[0], 1), g = 0; while (dd < D && g++ < 400) { if (!startDate || dd >= startDate) histDates.push(dd); dd = addD(dd, 1); } }
    histDates.forEach(hd => {
      const hlist = allTxForDate(hd);
      hlist.forEach(t => {
        const cell = byW[t.w];
        if (!cell || !cell.anchorDate) return;
        if (hd > cell.anchorDate) {
          cell.autoOpen += (t.dir === 'in' ? t.amt : -t.amt);
        }
      });
    });
  }

  ws.forEach(w => {
    const c = byW[w.id];
    c.open = c.hasCustomOpen ? n(curClose.customOpen[w.id]) : c.autoOpen;
    c.openGap = c.open - c.autoOpen;
  });

  txs.forEach(t => {
    const cell = byW[t.w] || byW[ws[0].id];
    if (!cell) return;
    if (t.dir === 'in') cell.inn += t.amt; else cell.out += t.amt;
    cell.txs.push(t);
  });

  let totOpen = 0, totIn = 0, totOut = 0, totExp = 0, totAct = 0, anyAct = false, allMatched = true;
  ws.forEach(w => {
    const c = byW[w.id];
    c.expected = c.open + c.inn - c.out;
    if (c.hasActual) {
      c.diff = c.actual - c.expected;
      totAct += c.actual;
      anyAct = true;
      if (Math.abs(c.diff) >= 0.5) allMatched = false;
    } else {
      totAct += c.expected;
      allMatched = false;
    }
    totOpen += c.open; totIn += c.inn; totOut += c.out; totExp += c.expected;
  });

  // ===== সহজ টোটাল মেথড (Simple Total Method) ক্যালকুলেশন =====
  // অভ্যন্তরীণ ট্রান্সফার বাদ দিয়ে প্রকৃত বাহ্যিক জমা (+) ও খরচ (−)
  const extTxs = txs.filter(t => !t.cat.startsWith('ট্রান্সফার'));
  const extInList = extTxs.filter(t => t.dir === 'in');
  const extOutList = extTxs.filter(t => t.dir === 'out');
  const extIn = extInList.reduce((acc, t) => acc + t.amt, 0);
  const extOut = extOutList.reduce((acc, t) => acc + t.amt, 0);

  // টোটাল মেথডের ওপেনিং ব্যালেন্স নির্ণয়:
  let tAutoOpen = n(S.settings.totOpenBal !== undefined ? S.settings.totOpenBal : ws.reduce((a, w) => a + n(w.openBal), 0));
  let tAnchor = '';
  for (let i = prevDates.length - 1; i >= 0; i--) {
    const pd0 = prevDates[i];
    if (startDate && pd0 < startDate) continue;
    const dc = S.dclose[pd0];
    if (!dc) continue;
    if (dc.totActual !== undefined && dc.totActual !== '') {
      tAutoOpen = n(dc.totActual);
      tAnchor = pd0;
      break;
    } else if (dc.counts && Object.keys(dc.counts).length > 0) {
      tAutoOpen = ws.reduce((a, w) => a + (dc.counts[w.id] !== undefined && dc.counts[w.id] !== '' ? n(dc.counts[w.id]) : 0), 0);
      tAnchor = pd0;
      break;
    } else if (dc.totCustomOpen !== undefined && dc.totCustomOpen !== '') {
      tAutoOpen = n(dc.totCustomOpen);
      allTxForDate(pd0).filter(t => !t.cat.startsWith('ট্রান্সফার')).forEach(t => { tAutoOpen += (t.dir === 'in' ? t.amt : -t.amt); });
      tAnchor = pd0;
      break;
    }
  }
  if (tAnchor) {
    let dd = addD(tAnchor, 1), g = 0;
    while (dd < D && g++ < 400) {
      if (!startDate || dd >= startDate) {
        allTxForDate(dd).filter(t => !t.cat.startsWith('ট্রান্সফার')).forEach(t => {
          tAutoOpen += (t.dir === 'in' ? t.amt : -t.amt);
        });
      }
      dd = addD(dd, 1);
    }
  }
  const hasTotCustomOpen = curClose.totCustomOpen !== undefined && curClose.totCustomOpen !== '';
  const tOpen = hasTotCustomOpen ? n(curClose.totCustomOpen) : tAutoOpen;
  const tExpected = tOpen + extIn - extOut;
  const hasTotActual = curClose.totActual !== undefined && curClose.totActual !== '';
  const tActual = hasTotActual ? n(curClose.totActual) : (anyAct ? totAct : null);
  const tHasAct = hasTotActual || anyAct;
  const tDiff = tHasAct ? (tActual - tExpected) : 0;

  // খাতওয়ারী (Category-wise) জমা ও খরচের গ্রুপ তৈরি (যাতে ১ নজরে বোঝা যায় কোথা থেকে কত আসলো আর কোথায় কত গেল)
  const inByCat = {}, outByCat = {};
  extInList.forEach(t => {
    const g = inByCat[t.cat] || (inByCat[t.cat] = { cat: t.cat, sum: 0, items: [] });
    g.sum += t.amt; g.items.push(t);
  });
  extOutList.forEach(t => {
    const g = outByCat[t.cat] || (outByCat[t.cat] = { cat: t.cat, sum: 0, items: [] });
    g.sum += t.amt; g.items.push(t);
  });

  // Today's revenue vs customer deposit vs shop/personal expense summary
  let revCounter = 0, revKept = 0, revDocPass = 0, shopExp = 0, perExp = 0, visaDepositIn = 0, visaFeePending = 0;
  txs.forEach(t => {
    if (t.isRev && t.dir === 'in') revCounter += t.amt;
    if (t.cat === 'দোকান খরচ' && t.dir === 'out') shopExp += t.amt;
    if (t.cat === 'ব্যক্তিগত খরচ' && t.dir === 'out') perExp += t.amt;
    if (t.cat === 'ভিসা টাকা জমা' && t.dir === 'in') visaDepositIn += t.amt;
  });
  if (!startDate || D >= startDate) {
    Object.values(S.wtx).forEach(t => {
      if (!t || t.date !== D) return;
      if (t.type === 'visa_return') revKept += n(t.kept);
      if (t.type === 'mfs_io' && n(t.fee) > 0 && t.subType === 'cash_in_client' && !t.mfsCutFee) revCounter += n(t.fee);
      if (t.type === 'mfs_io' && n(t.mfsExtra) > 0 && t.subType === 'cash_out_client') revCounter += n(t.mfsExtra);
    });
    Object.values(S.files).forEach(f => { const c = fileCalc(f); if (c.ret && f.retDate === D) revKept += c.kept; else if (!c.ret && f.appDate === D) revDocPass += c.profit; });
    Object.values(S.docs).forEach(d => { const c = docCalc(d); if (c.real && docProfitDate(d) === D) { if (d.status === 'ret') revKept += c.kept; else revDocPass += c.profit; } });
  }
  VISA.rows.forEach(v => {
    const fi = visaFeeInfo(v);
    if ((v.mode === 'APPOINTED' || v.mode === 'DELIVERED') && !fi.paid && fi.fee > 0) visaFeePending += fi.fee;
  });

  return {
    D, ws, byW, txs, extTxs, extInList, extOutList, inByCat, outByCat,
    curClose, totOpen, totIn, totOut, totExp, totAct, anyAct, allMatched,
    tAutoOpen, tAnchor, hasTotCustomOpen, tOpen, extIn, extOut, tExpected, tActual, tHasAct, tDiff,
    revCounter, revKept, revDocPass, shopExp, perExp, visaDepositIn, visaFeePending
  };
}

/* ---------- নতুন করে দৈনিক হিসাব শুরু করার সেটআপ শিট (Fresh Start — ১টি মোট ওপেনিং ব্যালেন্স) ---------- */
function freshStartSheet(defDate) {
  const tmr = addD(today(), 1);
  const D = defDate || UI.dhd || tmr;
  const R = dayReconcile(D);
  const dc = S.dclose[D] || {};
  const curTot = dc.totCustomOpen !== undefined && dc.totCustomOpen !== '' ? n(dc.totCustomOpen) : (S.settings.totOpenBal !== undefined ? n(S.settings.totOpenBal) : R.tOpen);

// Always show all 3 drawers + all added accounts in Fresh Start so per-account opening balances feed Total Method

  const ws = wallets();
  sheet('🚀 নতুন ব্যালেন্স দিয়ে দৈনিক হিসাব শুরু করুন',
    '<div class="mut sm">আপনি যেদিন থেকে (যেমন: আগামীকাল বা আজ) নতুন ব্যালেন্স দিয়ে দৈনিক হিসাব শুরু করতে চান, সেই তারিখটি বাছুন এবং প্রতিটি ড্রয়ার ও বিকাশ/ব্যাংকে শুরুর দিন সকালে যত টাকা থাকবে তা নিচে বসিয়ে সেভ করুন। আগের পুরনো কোনো ফাইল বা হিসাব এর সাথে মিশবে না!</div>'
    + '<div class="field"><label for="fs_date">কবে থেকে নতুন হিসাব শুরু করবেন?</label>'
    + '<div class="row" style="gap:6px"><input id="fs_date" type="date" value="' + D + '">'
    + '<button type="button" class="btn sm ghost" onclick="$(\x27fs_date\x27).value=\'' + today() + '\'">আজ (' + fd(today()) + ')</button>'
    + '<button type="button" class="btn sm" onclick="$(\x27fs_date\x27).value=\'' + tmr + '\'">আগামীকাল (' + fd(tmr) + ')</button></div></div>'
    + '<div class="row between"><b class="sm">প্রতিটি ড্রয়ার ও ব্যাংকের শুরুর ব্যালেন্স (৳):</b>'
    + '<button type="button" class="chip" style="padding:3px 10px;font-size:12px" onclick="zeroAllFs()">সব ০ (শূন্য) করুন</button></div>'
    + '<div class="stack" style="gap:8px">'
    + ws.map(w => {
      const curVal = (dc.customOpen && dc.customOpen[w.id] !== undefined) ? dc.customOpen[w.id] : n(w.openBal);
      return '<div class="row between" style="gap:10px;background:var(--bg);padding:8px 10px;border-radius:11px;border:1px solid var(--line)">'
        + '<div style="flex:1;min-width:0"><b class="sm">' + esc(w.name) + '</b><div class="sm mut" style="font-size:11px">' + (WKIND[w.kind] ? WKIND[w.kind].short : '') + (w.owner ? ' · ' + esc(w.owner) : '') + '</div></div>'
        + '<input class="fs_inp" id="fs_w_' + w.id + '" type="number" inputmode="decimal" style="max-width:135px;text-align:right;font-weight:700" placeholder="0" value="' + curVal + '">'
        + '</div>';
    }).join('')
    + '</div>'
    + '<button class="btn block" onclick="saveFreshStart()">✅ এই ব্যালেন্স দিয়ে নতুন হিসাব শুরু করুন</button>');
}

function saveFreshStartSimple() {
  const D = val('fs_date') || today();
  const v = n(val('fs_tot_open'));
  const nt = val('fs_tot_note').trim() || 'নতুন শুরুর ব্যালেন্স';
  const ws = wallets().slice();
  ws.forEach((w, i) => { w.openBal = (i === 0 ? v : 0); });
  S.settings.wallets = ws;
  S.settings.totOpenBal = v;
  S.settings.dhStartDate = D;
  saveSettings();

  const dc = S.dclose[D] || { id: D, date: D, counts: {}, customOpen: {}, openNote: {}, note: '' };
  dc.totCustomOpen = v;
  dc.totOpenNote = nt;
  dc.customOpen = dc.customOpen || {};
  ws.forEach((w, i) => { dc.customOpen[w.id] = (i === 0 ? v : 0); });
  dc.updatedAt = Date.now();
  S.dclose[D] = dc;
  save('dclose', D);
  UI.dhd = D === today() ? '' : D;
  closeSheet();
  toast('🚀 ' + fd(D) + ' থেকে ওপেনিং ব্যালেন্স ' + money(v) + ' সেট হয়েছে!');
}

function zeroAllFs() {
  wallets().forEach(w => { const el = $('fs_w_' + w.id); if (el) el.value = 0; });
}

function saveFreshStart() {
  const D = val('fs_date') || today();
  const ws = wallets().slice();
  const dc = S.dclose[D] || { id: D, date: D, counts: {}, customOpen: {}, openNote: {}, note: '' };
  dc.customOpen = dc.customOpen || {};
  dc.openNote = dc.openNote || {};
  let tot = 0;
  ws.forEach(w => {
    const v = n(val('fs_w_' + w.id));
    w.openBal = v;
    tot += v;
    dc.customOpen[w.id] = v;
    dc.openNote[w.id] = 'নতুন শুরুর ব্যালেন্স';
  });
  dc.totCustomOpen = tot;
  S.settings.totOpenBal = tot;
  S.settings.wallets = ws;
  S.settings.dhStartDate = D;
  saveSettings();
  dc.updatedAt = Date.now();
  S.dclose[D] = dc;
  save('dclose', D);
  UI.dhd = D === today() ? '' : D;
  closeSheet();
  toast('🚀 ' + fd(D) + ' থেকে নতুন শুরুর ব্যালেন্স সেট হয়েছে!');
}

    + '</div>'

    + '<div class="field"><label for="tob_note">📝 নোট / পরিবর্তনের কারণ (ঐচ্ছিক)</label><input id="tob_note" value="' + esc(dc.totOpenNote || '') + '" placeholder="যেমন: আজ থেকে নতুন ওপেনিং ব্যালেন্স শুরু"></div>'

}

/* ---------- স্মার্ট গরমিল ডিটেক্টর ---------- */
function saveSuspenseDiff(D) {
  const openVal = $('dc_tot_open') ? n(val('dc_tot_open')) : 0;
  const extIn = $('dh_ext_in_v') ? n(val('dh_ext_in_v')) : 0;
  const extOut = $('dh_ext_out_v') ? n(val('dh_ext_out_v')) : 0;
  const exp = openVal + extIn - extOut;
  const rawAct = val('dc_tot_act').trim();
  if (rawAct === '') { toast('আগে দিন শেষে কত টাকা আছে তা বক্সে লিখুন'); return; }
  const act = n(rawAct);
  const diff = Math.round(act - exp);
  if (Math.abs(diff) < 1) { toast('হিসাব ইতিমধ্যেই মিলে আছে!'); return; }
  saveDayClosingSimple(D, true);
  const id = uid();
  const isExtra = diff > 0;
  S.wtx[id] = {
    id, type: 'simple', dir: isExtra ? 'in' : 'out',
    cat: isExtra ? '🔍 অমীমাংসিত গরমিল — টাকা বেশি (পরে মিলাব)' : '🔍 অমীমাংসিত গরমিল — টাকা কম (পরে মিলাব)',
    isRev: false,
    date: D, amt: Math.abs(diff), w: 'w_counter',
    client: 'বড় গরমিল (' + (isExtra ? 'বেশি +' : 'কম −') + money(Math.abs(diff)) + ') — কারণ খুঁজে পেলে এটি মুছে আসল এন্ট্রি দেবেন',
    note: 'আপাতত ক্লোজিং মেলানোর জন্য রাখা হলো, পরে মনে পড়লে ডিলিট করে আসল খাতে দেবেন',
    by: actor(),
    createdAt: Date.now()
  };
  save('wtx', id);
  render();
  toast('📌 গরমিলের ' + money(Math.abs(diff)) + ' "পরে মিলাব (Suspense)" হিসেবে নোটসহ রাখা হয়েছে। পরে কারণ মনে পড়লে এটি মুছে আসল এন্ট্রি দেবেন!');
}

function smartHintsForTotal(R) {
  if (!R.tHasAct || Math.abs(R.tDiff) < 0.5) return '';
  const absD = Math.round(Math.abs(R.tDiff));
  const isBig = absD >= 300;
  const hints = [];

  // ১. হুবহু সমান অংকের এন্ট্রি বা অর্ধেক অংকের উল্টো এন্ট্রি (Double entry or wrong-side entry)
  R.extTxs.forEach(t => {
    if (Math.abs(t.amt - absD) < 2) {
      hints.push('🎯 <b>হুবহু টাকার মিল পাওয়া গেছে:</b> আজ <b>' + esc(t.title) + ' (' + esc(t.cat) + ': ' + money(t.amt) + ')</b> এন্ট্রি দেওয়া হয়েছে — এটি কি ভুলে দুবার লেখা হয়েছে বা ভুল করে তোলা হয়েছে?');
    } else if (absD >= 100 && Math.abs(t.amt * 2 - absD) < 2) {
      hints.push('🔄 <b>উল্টো এন্ট্রির সম্ভাবনা:</b> আজ <b>' + esc(t.title) + ' (' + money(t.amt) + ')</b> ' + (t.dir === 'in' ? 'জমা (+)' : 'খরচ (−)') + ' হিসেবে লেখা হয়েছে। এটি যদি ভুলে উল্টো দিকে লেখা হয় তবে ঠিক দুগুণ (' + money(absD) + ') গরমিল হয়!');
    }
  });

  // ২. ফাইলগুলোর মধ্যে আজকের সম্ভাব্য বাদ পড়া চালান, ভিসা খরচ, ডকুমেন্ট খরচ বা কাস্টমার জমা খোঁজা
  if (R.tDiff < 0) {
    // টাকা কম (Short) -> খরচ হয়েছে কিন্তু মার্ক করা হয়নি এমন ফাইল খুঁজি
    Object.values(S.files).forEach(f => {
      if (!f.challan && n(f.passFee) > 0 && Math.abs(n(f.passFee) - absD) <= 500) {
        hints.push('🛂 <b>পাসপোর্ট চালান চেক:</b> <b>' + esc(f.name) + '</b>-এর পাসপোর্ট ফি <b>' + money(f.passFee) + '</b> এখনো "চালান বাকি" দেখাচ্ছে — আজ কি এর চালান করেছেন?');
      }
    });
    VISA.rows.forEach(v => {
      const fi = visaFeeInfo(v);
      if (!fi.paid && fi.fee > 0 && Math.abs(fi.fee - absD) <= 500) {
        hints.push('✈️ <b>ভিসা খরচ চেক:</b> <b>' + esc(v.name) + '</b>-এর ভিসা ও সফটওয়্যার খরচ <b>' + money(fi.fee) + '</b> এখনো মার্ক করা হয়নি — আজ কি এটি পরিশোধ করেছেন?');
      }
    });
    Object.values(S.docs).forEach(d => {
      if (!d.costDone && n(d.cost) > 0 && Math.abs(n(d.cost) - absD) <= 300) {
        hints.push('📄 <b>ডকুমেন্ট খরচ চেক:</b> <b>' + esc(d.name) + ' (' + esc(d.cat) + ')</b>-এর কাজের খরচ <b>' + money(d.cost) + '</b> এখনো "খরচ বাকি" আছে — আজ কি টাকাটা দিয়েছেন?');
      }
    });
  } else {
    // টাকা বেশি (Extra) -> কাস্টমার জমা দিয়েছে কিন্তু তোলা হয়নি এমন ফাইল খুঁজি
    Object.values(S.files).forEach(f => {
      const c = fileCalc(f);
      if (c.due > 0 && (Math.abs(c.due - absD) <= 500 || f.appDate === R.D)) {
        hints.push('🛂 <b>পাসপোর্ট জমা চেক:</b> <b>' + esc(f.name) + '</b>-এর ফাইলে এখনো <b>' + money(c.due) + '</b> বাকি দেখাচ্ছে — তিনি কি আজ টাকা জমা দিয়েছেন?');
      }
    });
    Object.values(S.docs).forEach(d => {
      const c = docCalc(d);
      if (c.due > 0 && (Math.abs(c.due - absD) <= 300 || d.recvDate === R.D)) {
        hints.push('📄 <b>ডকুমেন্ট জমা চেক:</b> <b>' + esc(d.name) + ' (' + esc(d.cat) + ')</b>-এর কাজে <b>' + money(c.due) + '</b> বাকি দেখাচ্ছে — তিনি কি আজ টাকা দিয়েছেন?');
      }
    });
  }

  // ৩. সংখ্যা লেখার ভুল (শূন্য কম/বেশি বা উল্টাপাল্টা সংখ্যা — Divisible by 9 rule)
  if (absD >= 90 && absD % 9 === 0) {
    hints.push('🔢 <b>সংখ্যা বা শূন্য (0) লেখার ভুল হতে পারে:</b> গরমিলের অংকটি (' + money(absD) + ') ৯ দিয়ে বিভাজ্য! সাধারণত কোনো সংখ্যায় একটি শূন্য (0) কম বা বেশি পড়লে (যেমন ৫০০-এর জায়গায় ৫০০০ বা ৫০) অথবা অংক উল্টে গেলে (যেমন ২৪০০-এর জায়গায় ৪২০০) এমন গরমিল হয়। উপরের বক্সগুলোর সংখ্যা একবার মিলিয়ে দেখুন।');
  }

  if (R.tDiff < 0) {
    hints.push('💸 <b>হিসাবের চেয়ে ' + money(absD) + ' কম আছে (Short):</b> (১) আজ কোনো বড় খরচ, পাসপোর্ট চালান, ভিসা ফি বা কাস্টমার রিটার্ন দিয়েছেন যা অ্যাপে তোলা হয়নি? (২) কেউ কি আজ বড় অংকের টাকা বাকি বা ধার নিয়েছে যা বাকি খাতায় লেখেননি?');
  } else {
    hints.push('💰 <b>হিসাবের চেয়ে ' + money(absD) + ' বেশি আছে (Extra):</b> (১) কোনো কাস্টমার কি পাসপোর্ট, ভিসা বা ডকুমেন্টের টাকা জমা দিয়েছে যা এখনো ফাইলে তোলা হয়নি? (২) কেউ কি আগের বাকি টাকা শোধ করেছে বা বিকাশ/ব্যাংকে এক্সট্রা টাকা পাঠিয়েছে যা লেখেননি?');
  }

  return '<div class="ipbox stack" style="gap:8px;background:' + (isBig ? 'var(--badbg)' : 'var(--warnbg)') + ';border:2px solid ' + (isBig ? 'var(--bad)' : 'var(--warn)') + ';font-size:13px">'
    + '<div class="row between wrapr" style="gap:6px"><b style="color:' + (isBig ? 'var(--bad)' : 'var(--warn)') + ';font-size:14.5px">'
    + (isBig ? '🚨 বড় গরমিল ডিটেক্টিভ (' + money(absD) + ' গরমিল — সম্ভাব্য কারণসমূহ):' : '💡 কেন গরমিল হতে পারে (স্মার্ট ক্লু):')
    + '</b>'
    + (isBig ? '<span class="pill bad">বড় অংকের গরমিল — চেক করুন</span>' : '<span class="pill warn">ছোট গরমিল</span>')
    + '</div>'
    + hints.map(h => '<div style="background:var(--card);padding:7px 10px;border-radius:8px;border:1px solid var(--line)">' + h + '</div>').join('')
    + (isBig ? '<div class="row between wrapr" style="gap:8px;padding-top:4px;border-top:1px dashed var(--line)">'
      + '<span class="sm"><b>রাতে তাড়াহুড়োয় কারণ খুঁজে না পেলে কী করবেন?</b><br>এটিকে বিকাশ চার্জে না মিশিয়ে আপাতত <b>"পরে মিলাব (Suspense)"</b> হিসেবে নোটসহ রেখে দিন। কাল মনে পড়লে ডিলিট করে আসল খাতে বসাতে পারবেন:</span>'
      + '<button type="button" class="btn sm danger" onclick="saveSuspenseDiff(\'' + R.D + '\')">📌 "পরে মিলাব (Suspense)" হিসেবে লিখে রাখুন</button>'
      + '</div>' : '')
    + '</div>';
}

function smartHintsForWallet(R, wid) {
  const c = R.byW[wid];
  if (!c || !c.hasActual || Math.abs(c.diff) < 0.5) return '';
  const absD = Math.round(Math.abs(c.diff));
  const hints = [];
  R.ws.forEach(other => {
    if (other.id === wid) return;
    const oc = R.byW[other.id];
    if (oc && oc.hasActual && Math.abs(oc.diff + c.diff) < 2) {
      hints.push('🔄 <b>ড্রয়ার/ব্যাংক অদলবদল হতে পারে:</b> এই মাধ্যমে ' + (c.diff < 0 ? 'কম ' : 'বেশি ') + money(absD) + ' আর <b>' + esc(other.name) + '</b>-এ ঠিক উল্টো ' + (oc.diff < 0 ? 'কম ' : 'বেশি ') + money(Math.abs(oc.diff)) + ' দেখাচ্ছে!');
    }
  });
  if (c.diff < 0) {
    hints.push('💸 <b>টাকা কম (Short ' + money(absD) + '):</b> কোনো খরচ বা প্রদান লেখেননি অথবা অন্য ড্রয়ারে লেখা হয়েছে কিনা দেখুন।');
  } else {
    hints.push('💰 <b>টাকা বেশি (Extra ' + money(absD) + '):</b> কোনো কাস্টমারের জমা বা কাউন্টারের আয় লেখা বাকি আছে কিনা দেখুন।');
  }
  return '<div class="ipbox stack" style="gap:6px;background:var(--warnbg);border-color:var(--warn);font-size:12.5px">'
    + '<b style="color:var(--warn)">💡 গরমিল মেলানোর স্মার্ট ক্লু:</b>'
    + hints.map(h => '<div>' + h + '</div>').join('')
    + '</div>';
}

/* ---------- কাস্টম ওপেনিং ব্যালেন্স শিট (আলাদা ড্রয়ার মোডের জন্য) ---------- */
function openBalSheet(D, wid) {
  const R = dayReconcile(D), c = R.byW[wid];
  if (!c) return;
  sheet('শুরুর ব্যালেন্স (Opening) — ' + esc(c.w.name),
    '<div class="mut sm">গতকালের ক্লোজিং অনুযায়ী অটো ওপেনিং <b>' + money(c.autoOpen) + '</b>। কাস্টম ওপেনিং দিতে চাইলে নিচে লিখুন:</div>'
    + '<div class="field"><label for="ob_val">আজকের শুরুর ব্যালেন্স (৳)</label><input id="ob_val" type="number" inputmode="decimal" value="' + (c.hasCustomOpen ? c.open : '') + '" placeholder="অটো: ' + Math.round(c.autoOpen) + '"></div>'
    + '<div class="field"><label for="ob_note">📝 কারণ</label><input id="ob_note" value="' + esc(c.openNote) + '"></div>'
    + '<div class="grid2"><button class="btn block" onclick="saveCustomOpen(\'' + D + '\',\'' + wid + '\')">সেভ করুন</button>'
    + '<button class="btn ghost block" onclick="$(\'ob_val\').value=\'\';saveCustomOpen(\'' + D + '\',\'' + wid + '\')">🔄 অটো ব্যালেন্সে ফেরান</button></div>');
}
function saveCustomOpen(D, wid) {
  const dc = S.dclose[D] || { id: D, date: D, counts: {}, customOpen: {}, openNote: {}, note: '' };
  dc.customOpen = dc.customOpen || {};
  dc.openNote = dc.openNote || {};
  const raw = val('ob_val').trim();
  if (raw === '') { delete dc.customOpen[wid]; delete dc.openNote[wid]; }

function autoAdjustMfsDiff(D) {
  const openVal = $('dc_tot_open') ? n(val('dc_tot_open')) : 0;
  const extIn = $('dh_ext_in_v') ? n(val('dh_ext_in_v')) : 0;
  const extOut = $('dh_ext_out_v') ? n(val('dh_ext_out_v')) : 0;
  const exp = openVal + extIn - extOut;
  const rawAct = val('dc_tot_act').trim();
  if (rawAct === '') { toast('আগে দিন শেষে কত টাকা আছে তা বক্সে লিখুন'); return; }
  const act = n(rawAct);
  const diff = Math.round(act - exp);
  if (Math.abs(diff) < 1) { toast('হিসাব ইতিমধ্যেই মিলে আছে!'); return; }
  // Save current box values first so user doesn't lose typed numbers
  saveDayClosingSimple(D, true);
  const id = uid();
  const isExtra = diff > 0;
  const mfsW = (wallets().find(w => w.kind === 'mfs') || { id: 'w_bkash' }).id;
  S.wtx[id] = {
    id, type: 'mfs_io', subType: 'mfs_extra_adj',
    date: D, mfsW, cashW: 'w_counter',
    amt: Math.abs(diff), fee: 0, mfsExtra: 0, cashGiven: 0, cashGot: 0,
    dir: isExtra ? 'in' : 'out',
    client: isExtra ? 'বিকাশ/নগদ ক্যাশ-ইন/আউট কমিশন ও এক্সট্রা সমন্বয় (+)' : 'বিকাশ/নগদ পেমেন্ট ও ক্যাশ-আউট চার্জ সমন্বয় (−)',
    note: 'দিন শেষের স্বাভাবিক বিকাশ/নগদ চার্জ ও কমিশন অটো-সমন্বয়',
    by: actor(),
    createdAt: Date.now()
  };
  save('wtx', id);
  render();
  toast(isExtra ? ('✅ +' + money(Math.abs(diff)) + ' বিকাশ/নগদ কমিশন (আয়) হিসেবে যোগ হয়ে হিসাব ১০০% মিলে গেছে!') : ('✅ −' + money(Math.abs(diff)) + ' বিকাশ/নগদ চার্জ (খরচ) হিসেবে ধরা হয়ে হিসাব ১০০% মিলে গেছে!'));
}

function saveOpeningOnlySimple(D) {
  const prev = S.dclose[D] || {};
  const customOpen = Object.assign({}, prev.customOpen || {});
  const ws = wallets().slice();
  let sumO = 0, anyO = false;
  ws.forEach(w => {
    const oInp = $('tot_open_w_' + w.id);
    if (oInp && oInp.value.trim() !== '') {
      const v = n(oInp.value);
      customOpen[w.id] = v;
      w.openBal = v;
      sumO += v;
      anyO = true;
    }
  });
  const rawTotOpen = $('dc_tot_open') ? val('dc_tot_open').trim() : '';
  const totOpenVal = rawTotOpen !== '' ? n(rawTotOpen) : sumO;
  // If user is setting opening balance for today or tomorrow and dhStartDate isn't set (or is after D), set dhStartDate = D so old data never pollutes daily hisab!
  if (!S.settings.dhStartDate || S.settings.dhStartDate > D) {
    S.settings.dhStartDate = D;
  }
  S.settings.totOpenBal = totOpenVal;
  S.settings.wallets = ws;
  saveSettings();
  S.dclose[D] = Object.assign({}, prev, {
    id: D, date: D,
    customOpen,
    totCustomOpen: totOpenVal,
    by: actor(),
    updatedAt: Date.now()
  });
  save('dclose', D);
  render();
  toast('🌅 ' + fd(D) + ' তারিখের শুরুর ব্যালেন্স (' + money(totOpenVal) + ') সেভ হয়েছে! আগের সব ডাটা অক্ষত রেখে এখান থেকেই হিসাব চলবে।');
}

function copyUnchangedOpenToEnd() {
  let copied = 0;
  document.querySelectorAll('.tot_w_end').forEach(eInp => {
    const wid = eInp.getAttribute('data-wid');
    const oInp = $('tot_open_w_' + wid);
    if (eInp.value.trim() === '' && oInp && oInp.value.trim() !== '') {
      eInp.value = oInp.value;
      copied++;
    }
  });
  syncTotAcctBoxes();
  toast(copied > 0 ? ('⚡ ' + copied + 'টি খালি বক্সে সকালের ব্যালেন্স বসানো হয়েছে! এখন যে বক্সগুলোতে টাকা বদলেছে শুধু সেগুলো এডিট করুন।') : 'সবগুলো বক্সেই ইতিমধ্যে ব্যালেন্স লেখা আছে!');
}

function syncTotAcctBoxes(extIn, extOut) {
  let sumO = 0, sumE = 0, anyE = false;
  document.querySelectorAll('.tot_w_open').forEach(inp => { sumO += n(inp.value); });
  document.querySelectorAll('.tot_w_end').forEach(inp => {
    const wid = inp.getAttribute('data-wid');
    const oVal = $('tot_open_w_' + wid) ? n($('tot_open_w_' + wid).value) : 0;
    const dEl = $('tot_dl_' + wid);
    if (inp.value.trim() !== '') {
      const eVal = n(inp.value);
      sumE += eVal;
      anyE = true;
      if (dEl) {
        const dlt = Math.round(eVal - oVal);
        dEl.className = 'sm ' + (dlt > 0 ? 'good' : (dlt < 0 ? 'bad' : 'mut'));
        dEl.textContent = dlt === 0 ? 'অপরিবর্তিত (৳০)' : (dlt > 0 ? 'আজ বেড়েছে: +' + money(dlt) : 'আজ কমেছে: −' + money(Math.abs(dlt)));
      }
    } else if (dEl) {
      dEl.className = 'sm mut';
      dEl.textContent = '';
    }
  });
  if ($('dc_tot_open')) $('dc_tot_open').value = Math.round(sumO);
  if ($('dc_tot_act')) $('dc_tot_act').value = anyE ? Math.round(sumE) : '';
  dhTotLiveDiff();
}

function dhTotLiveDiff(expOverride) {
  const openVal = $('dc_tot_open') ? n(val('dc_tot_open')) : 0;
  const extIn = $('dh_ext_in_v') ? n(val('dh_ext_in_v')) : 0;
  const extOut = $('dh_ext_out_v') ? n(val('dh_ext_out_v')) : 0;
  const exp = ($('dc_tot_open') && $('dh_ext_in_v')) ? (openVal + extIn - extOut) : n(expOverride);
  if ($('lbl_tot_open')) $('lbl_tot_open').textContent = Math.round(openVal);
  if ($('lbl_tot_exp')) $('lbl_tot_exp').textContent = Math.round(exp);

  const raw = val('dc_tot_act').trim(), el = $('dc_tot_df');
  if (!el) return;
  if (raw === '') { el.className = 'mut'; el.textContent = 'উপরের বক্সগুলোতে দিন শেষের টাকা লিখলেই সাথে সাথে মিলেছে কিনা দেখাবে'; return; }
  const act = n(raw), df = act - exp;
  if (Math.abs(df) < 0.5) { el.className = 'good b'; el.textContent = '✅ আলহামদুলিল্লাহ! হিসাবের সাথে হুবহু মিলেছে (পার্থক্য ৳০)!'; }
  else if (df < 0) { el.className = 'bad b'; el.textContent = '⚠ হিসাবের চেয়ে ' + money(Math.abs(df)) + ' কম আছে (Short)! (বিকাশ চার্জ হলে সরাসরি সেভ করতে পারেন অথবা ১-ক্লিকে মেলাতে পারেন)'; }
  else { el.className = 'bad b'; el.textContent = '💡 হিসাবের চেয়ে ' + money(df) + ' বেশি আছে (Extra)! (বিকাশ কমিশন হলে সরাসরি সেভ করতে পারেন অথবা ১-ক্লিকে মেলাতে পারেন)'; }
}

function saveDayClosingSimple(D, silent) {
  const prev = S.dclose[D] || {};
  const counts = Object.assign({}, prev.counts || {});
  const customOpen = Object.assign({}, prev.customOpen || {});
  let sumO = 0, sumE = 0, anyO = false, anyE = false;

  wallets().forEach(w => {
    const oInp = $('tot_open_w_' + w.id);
    const eInp = $('tot_end_w_' + w.id);
    if (oInp && oInp.value.trim() !== '') {
      customOpen[w.id] = n(oInp.value);
      sumO += n(oInp.value);
      anyO = true;
    }
    if (eInp && eInp.value.trim() !== '') {
      counts[w.id] = n(eInp.value);
      sumE += n(eInp.value);
      anyE = true;
    } else if (eInp) {
      delete counts[w.id];
    }
  });

  if (!S.settings.dhStartDate || S.settings.dhStartDate > D) {
    S.settings.dhStartDate = D;
    saveSettings();
  }

  const R = dayReconcile(D);
  const rawTotOpen = $('dc_tot_open') ? val('dc_tot_open').trim() : '';
  const rawTotAct = val('dc_tot_act') ? val('dc_tot_act').trim() : '';
  const totOpenVal = rawTotOpen !== '' ? n(rawTotOpen) : (anyO ? sumO : R.tOpen);
  const expNow = totOpenVal + R.extIn - R.extOut;
  const totAct = rawTotAct !== '' ? n(rawTotAct) : (anyE ? sumE : expNow);

  S.dclose[D] = Object.assign({}, prev, {
    id: D, date: D,
    counts,
    customOpen,
    totCustomOpen: totOpenVal,
    totActual: totAct,
    note: $('dh_close_note') ? val('dh_close_note').trim() : (prev.note || ''),
    by: actor(),
    updatedAt: Date.now()
  });
  save('dclose', D);
  if (!silent) {
    render();
    toast('✅ দিন শেষের হিসাব (' + money(totAct) + ') সেভ হয়েছে! প্রতিটি বক্সের Ending কালকের Opening ব্যালেন্স হয়ে যাবে।');
  }
}

function dhLiveDiff(wid, exp) {
  const raw = val('dc_w_' + wid).trim(), el = $('dc_df_' + wid);
  if (!el) return;
  if (raw === '') { el.className = 'mut'; el.textContent = 'গোনা টাকা লিখলে সাথে সাথে কম/বেশি দেখাবে'; return; }
  const act = n(raw), df = act - exp;
  if (Math.abs(df) < 0.5) { el.className = 'good b'; el.textContent = '✓ হিসাবের সাথে হুবহু মিলেছে'; }
  else if (df < 0) { el.className = 'bad b'; el.textContent = '⚠ হিসাবের চেয়ে ' + money(Math.abs(df)) + ' কম আছে!'; }
  else { el.className = 'bad b'; el.textContent = '⚠ হিসাবের চেয়ে ' + money(df) + ' বেশি আছে!'; }
}

function fillAllExpected(D) {
  const R = dayReconcile(D);
  R.ws.forEach(w => {
    const inp = $('dc_w_' + w.id);
    if (inp) { inp.value = Math.round(R.byW[w.id].expected); dhLiveDiff(w.id, R.byW[w.id].expected); }
  });
  toast('সব ড্রয়ার ও ব্যাংকে হিসাবের ব্যালেন্স বসানো হয়েছে — এবার সেভ চাপুন');
}

function saveDayClosing(D) {
  const prev = S.dclose[D] || {};
  const counts = Object.assign({}, prev.counts || {});
  let tot = 0, any = false;
  wallets().forEach(w => {
    const inp = $('dc_w_' + w.id);
    if (!inp) return;
    const raw = inp.value.trim();
    if (raw !== '') { counts[w.id] = n(raw); tot += n(raw); any = true; }
    else delete counts[w.id];
  });
  const wnotes = Object.assign({}, prev.wnotes || {}); wallets().forEach(w => { const e = $('dc_n_' + w.id); if (e) { const v = e.value.trim(); if (v) wnotes[w.id] = v; else delete wnotes[w.id]; } });
  S.dclose[D] = { id: D, date: D, wnotes, counts, totActual: any ? tot : prev.totActual, totCustomOpen: prev.totCustomOpen, totOpenNote: prev.totOpenNote, customOpen: prev.customOpen || {}, openNote: prev.openNote || {}, note: val('dh_close_note').trim(), by: actor(), updatedAt: Date.now() };
  save('dclose', D);
  render();
  toast('✅ দিন শেষের হিসাব সেভ হয়েছে!');
}

function setMfsSub(s) {
  window._mfsSub = s;
  [['ms_1', 'cash_out_client'], ['ms_2', 'cash_in_client'], ['ms_3', 'send_cost'], ['ms_4', 'mfs_extra_adj']].forEach(([id, k]) => {
    const el = $(id); if (el) el.className = 'chip' + (k === s ? ' on' : '');
  });
  $('mf_cash_wrap').hidden = (s === 'send_cost' || s === 'mfs_extra_adj');
  $('mf_fee_wrap').hidden = (s === 'mfs_extra_adj');
  $('mf_adj_dir_wrap').hidden = (s !== 'mfs_extra_adj');
  $('mf_amt_lbl').textContent = s === 'mfs_extra_adj' ? 'এক্সট্রা টাকার অংক (৳)' : 'মূল টাকার অংক (৳)';
  mfCalcPreview();
}

function mfCalcPreview() {
  const sub = window._mfsSub || 'cash_out_client';
  const base = n(val('mf_amt')), fee = n(val('mf_fee'));
  const el = $('mf_prev'); if (!el) return;
  if (sub === 'cash_out_client') {
    el.innerHTML = '📱 বিকাশ/নগদে যোগ হবে: <b class="good">+' + money(base + fee) + '</b> · 🗄️ ক্যাশ ড্রয়ার থেকে কমবে: <b class="bad">−' + money(base) + '</b> (এক্সট্রা ' + money(fee) + ' বিকাশেই থাকবে)';
  } else if (sub === 'cash_in_client') {
    el.innerHTML = '📱 বিকাশ/নগদ থেকে কমবে: <b class="bad">−' + money(base) + '</b> · 🗄️ ক্যাশ ড্রয়ারে যোগ হবে: <b class="good">+' + money(base + fee) + '</b> (এক্সট্রা চার্জ ' + money(fee) + ' আপনার আয়)';

    el.innerHTML = '📱 বিকাশ/নগদ থেকে মোট কমবে: <b class="bad">−' + money(base + fee) + '</b> (মূল ' + money(base) + ' + চার্জ ' + money(fee) + ')';
  } else {
    const d = window._mfAdjDir || 'in';
    el.innerHTML = '📱 শুধু বিকাশ/নগদ ব্যালেন্সে ' + (d === 'in' ? '<b class="good">+' + money(base) + ' যোগ হবে</b>' : '<b class="bad">−' + money(base) + ' বিয়োগ হবে</b>') + ' (ক্যাশ ড্রয়ারে কোনো পরিবর্তন হবে না)';

function saveMfsIo(editId) {
  const sub = window._mfsSub || 'cash_out_client';
  const base = n(val('mf_amt')), fee = n(val('mf_fee'));
  if (base <= 0) { toast('টাকার অংক দিন'); return; }
  const id = editId || uid();
  const rec = {
    id, type: 'mfs_io', subType: sub,
    date: val('mf_date') || today(),
    mfsW: val('mf_mfs') || 'w_bkash',
    cashW: val('mf_cash') || 'w_counter',
    amt: base, fee: fee,
    mfsExtra: sub === 'cash_out_client' ? fee : 0,
    cashGiven: sub === 'cash_out_client' ? base : 0,
    cashGot: sub === 'cash_in_client' ? (base + fee) : 0,
    dir: sub === 'mfs_extra_adj' ? (window._mfAdjDir || 'in') : 'out',
    client: val('mf_client').trim(),
    note: val('mf_note').trim(),
    by: actor(),
    createdAt: (S.wtx[id] && S.wtx[id].createdAt) || Date.now()
  };
  S.wtx[id] = rec;
  save('wtx', id);
  closeSheet();
  toast('বিকাশ/নগদ লেনদেন সেভ হয়েছে');
}

function wioDir(k) { window._wio = k === 'in' ? 'in' : 'out'; $('wio_out').className = 'chip' + (window._wio === 'out' ? ' on' : ''); $('wio_in').className = 'chip' + (window._wio === 'in' ? ' on' : ''); }
function saveWalletIo() {
  const amt = n(val('qe_amt')); if (amt <= 0) { toast('টাকার অংক দিন'); return; }
  const dir = window._wio === 'in' ? 'in' : 'out', id = uid();
  S.wtx[id] = { id, type: 'simple', dir, cat: dir === 'in' ? 'অন্য জমা' : 'অন্য খরচ', isRev: false, date: val('qe_date') || today(), amt, w: val('qe_w') || 'w_counter', client: val('qe_client').trim(), note: val('qe_note').trim(), by: actor(), createdAt: Date.now() };
  save('wtx', id); closeSheet(); toast('সেভ হয়েছে');
}
function vrCalc(changed) {
  const g = Math.max(0, n(val('vr_gross')));
  let k = Math.max(0, n(val('vr_kept')));
  let r = Math.max(0, n(val('vr_ref')));
  if (g > 0) {
    if (changed === 'ref') {
      if (r > g) { r = g; $('vr_ref').value = r; toast('⚠ ফেরত টাকা জমার (' + money(g) + ') চেয়ে বেশি হতে পারবে না!'); }
      k = Math.max(0, g - r);
      $('vr_kept').value = k;
    } else {
      if (k > g) { k = g; $('vr_kept').value = k; toast('⚠ রাখা চার্জ জমার (' + money(g) + ') চেয়ে বেশি হতে পারবে না!'); }
      r = Math.max(0, g - k);
      $('vr_ref').value = r;
    }
  }
  const msg = $('vr_live_msg');
  if (msg && g > 0) {
    msg.innerHTML = 'জমা ছিল: <b>' + money(g) + '</b> − রাখা চার্জ (আপনার রেভিনিউ): <b class="good">' + money(k) + '</b> = কাস্টমারকে ফেরত (ক্যাশ থেকে কমবে): <b class="bad">−' + money(r) + '</b>';
  }
}

function saveQuickWtx(dir, cat, isRev, editId) {

  const id = editId || uid();
  S.wtx[id] = {
    id, type: 'simple', dir, cat, isRev: !!isRev,
    date: val('qe_date') || today(),
    amt, w: val('qe_w') || 'w_counter',
    client: val('qe_client').trim(),
    note: val('qe_note').trim(),
    by: actor(),
    createdAt: (S.wtx[id] && S.wtx[id].createdAt) || Date.now()
  };
  save('wtx', id);
  closeSheet();
  toast('সেভ হয়েছে');
}

function saveVisaReturnWtx(editId) {
  let kept = Math.max(0, n(val('vr_kept'))), refAmt = Math.max(0, n(val('vr_ref'))), gross = Math.max(0, n(val('vr_gross')));
  if (kept <= 0 && refAmt <= 0) { toast('রাখা চার্জ বা ফেরত টাকার অংক দিন'); return; }
  if (gross > 0 && (kept + refAmt > gross + 0.001)) {
    toast('❌ ভুল রোধ: কাস্টমার জমা দিয়েছিল ' + money(gross) + '। তাই রাখা চার্জ (' + money(kept) + ') ও ফেরত (' + money(refAmt) + ') মিলে ' + money(gross) + '-এর বেশি হতে পারবে না!');
    $('vr_ref').value = Math.max(0, gross - kept);
    return;
  }
  const id = editId || uid();
  S.wtx[id] = {
    id, type: 'visa_return', dir: 'out', cat: 'ভিসা ফাইল ফেরত',
    date: val('vr_date') || today(),
    gross, kept, amt: refAmt,
    w: val('vr_w') || 'w_visacash',
    client: val('vr_client').trim() || 'ভিসা ক্লায়েন্ট',
    note: val('vr_note').trim(),

    createdAt: (S.wtx[id] && S.wtx[id].createdAt) || Date.now()

  toast('ভিসা ফেরত ও রাখা চার্জ সেভ হয়েছে');

function saveWalletItem(id) {

    sub: f.g === 'mfs' ? (f.prov === 'Other' ? (f.provOther || '').trim() : f.prov) : (f.g === 'bank' ? f.bank.trim() : (old.sub || '')),
    acct: f.g === 'drawer' ? '' : f.acct, owner: f.g === 'drawer' ? (old.owner || '') : (per ? 'Personal' : 'Business'), openBal: n(val('wf_open')) };
  const idx = list.findIndex(x => x.id === rec.id);
  if (idx >= 0) list[idx] = rec; else list.push(rec);

}
